      if (c) c.focus({ preventScroll: true });
    }
    function closeSheet() {
      const k = sheetKey;
      sheetKey = null; sheetMode = null;
      document.getElementById("sheetBackdrop").hidden = true;
      document.body.style.overflow = "";
      const card = k && document.querySelector(`.ipo-card[data-open="${CSS.escape(k)}"]`);
      if (card) card.focus({ preventScroll: true });
    }
    function v(n) { return n == null ? "" : String(n); }
    function renderSheet() {
      const el = document.getElementById("sheet");
      if (sheetMode === "summary") return renderSummary(el);
      if (sheetMode === "paste") {
        renderPaste(el);
        const ta = document.getElementById("pasteBox");
        if (ta) ta.value = pasteText;
        if (pasteMsg) { const n = document.createElement("div"); n.className = "disclaim"; n.style.color = "#15803d"; n.textContent = pasteMsg; el.querySelector(".btn-row").after(n); }
        return;
      }
      if (sheetMode === "cal") return renderCal(el);
      const item = items.find((it) => itemKey(it) === sheetKey);
      if (!item) { el.innerHTML = ""; return; }
      const isSub = sheetType === "subscribe";
      const range = item.subscribeStart === item.subscribeEnd ? formatYMDKo(item.subscribeStart) : `${formatYMDKo(item.subscribeStart)}~${formatYMDKo(item.subscribeEnd)}`;
      const res = resultInfo(item);
      const r = item.result;
      const rec = myRecord(item);
      const url = item.videoUrl || item.analysisUrl || "";
      const defFee = defaultSubFee(item);
      const offer = offerOf(item, rec);
      let html = `<div class="sheet-head">` +
        `<span class="type-badge ${isSub ? "subscribe" : "listing"}"><span class="b-long">${isSub ? "청약" : "상장"}</span><span class="b-short">${isSub ? "청" : "상"}</span></span>` +
        `<h3 id="sheetTitle">${escapeHtml(item.name)}</h3>${toggleHtml(item)}` +
        `<button type="button" class="sheet-close" aria-label="닫기">×</button></div>` +
        `<div class="kv">청약 <b>${escapeHtml(range)}</b> · 환불 <b>${escapeHtml(item.refundDate ? formatYMDKo(item.refundDate) : "확인중")}</b> · 상장 <b>${escapeHtml(item.listDate ? formatYMDKo(item.listDate) : "미정")}</b><br>` +
        `최소증거금 <b>${escapeHtml(displayDeposit(item.minDeposit))}</b> · 점수 <b>${escapeHtml(displayScore(item.score))}</b>${displayBrokers(item) ? ` · <b>${escapeHtml(displayBrokers(item))}</b>` : ""}</div>`;
      if (url) {
        html += `<a class="yt-btn" href="${escapeHtml(youtubeAppHref(url, item))}" data-yt-btn="${escapeHtml(url)}">▶ 공모주린이 종합점수 영상</a>`;
      }
      const listed = item.listDate && item.listDate <= toDateKey(new Date());
      if (!listed) html += recSectionHtml(item) + moneySectionHtml(item, rec);
      html += `<div class="sheet-sec"><h4>상장 결과 (예상 · 최소청약 기준)</h4>`;
      if (res && r) {
        html += `<ul class="lines">${res.detail.split("\n").map((l) => `<li>${escapeHtml(l)}</li>`).join("")}</ul>`;
        const src = r.source || {};
        const links = [["가격", src.prices], ["배정", src.allotment], ["수수료", src.fee]].filter((x) => x[1]);
        if (links.length) html += `<div class="src">출처: ${links.map(([n, u]) => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</div>`;
      } else if (res) {
        html += `<div class="kv">결과 확인중</div>`;
      } else {
        html += `<div class="kv">아직 상장 전이에요.</div>`;
      }
      html += `</div>`;
      html += `<div class="sheet-sec"><h4>내 매도 기록 → 실제 손익</h4>` +
        `<div class="form-grid">` +
        `<label>공모가 (원)<input type="number" inputmode="numeric" min="0" data-f="offer" value="${escapeHtml(v(rec.offer))}" placeholder="${escapeHtml(v(r && r.offerPrice) || "공모가")}"></label>` +
        `<label>청약수수료 (원)<input type="number" inputmode="numeric" min="0" data-f="fee" value="${escapeHtml(v(rec.fee))}" placeholder="${defFee != null ? defFee + " (기본)" : "증권사 수수료"}"></label>` +
        `</div><div class="sell-rows">` +
        rec.sells.map((x, i) => `<div class="sell-row" data-i="${i}" data-order="${escapeHtml(x.orderNo || "")}" data-fill="${escapeHtml(x.fillKey || "")}" data-time="${escapeHtml(x.time || "")}"${x.orderNo ? ` title="주문번호 ${escapeHtml(x.orderNo)}"` : ""}>` +
          `<label>${i === 0 ? "매도 주수" : `매도 주수 ${i + 1}`}<input type="number" inputmode="numeric" min="0" data-f="shares" value="${escapeHtml(v(x.shares))}" placeholder="주"></label>` +
          `<label>${i === 0 ? "매도가 (원)" : `매도가 ${i + 1}`}<input type="number" inputmode="numeric" min="0" data-f="price" value="${escapeHtml(v(x.price))}" placeholder="원"></label>` +
          `<button type="button" class="row-del" data-del="${i}" aria-label="이 줄 삭제">✕</button></div>`).join("") +
        `</div><button type="button" class="row-add">+ 나눠 판 매도 추가</button>` +
        `<div class="cost-box"><label class="chk"><input type="checkbox" data-cost="on" ${costCfg.on ? "checked" : ""}> 매도 비용 반영 (증권거래세 0.20% + 매도수수료)</label>` +
        `<div class="rate">매도수수료율<input type="number" inputmode="decimal" step="0.001" min="0" data-cost="feePct" value="${escapeHtml(v(costCfg.feePct))}">% <span>(모든 종목 공통)</span></div></div>` +
        `<div class="my-calc" id="myCalc"></div>` +
        `<div class="my-actions"><span>${rec.source === "json" ? "기본값: 사이트 데이터(ipos.json)" : rec.source === "local" ? "이 기기에 저장됨" : "입력하면 이 기기에 자동 저장"}</span>` +
        `<button type="button" class="my-clear">${rec.source === "local" && jsonMy(item) ? "사이트 값으로 되돌리기" : "내 기록 지우기"}</button></div>` +
        `</div>`;
      if (listed) html += recSectionHtml(item) + moneySectionHtml(item, rec);
      el.innerHTML = html;
      renderMyCalcBox(item);
    }
    function renderMyCalcBox(item) {
      const box = document.getElementById("myCalc");
      if (!box) return;
      const c = myCalc(item);
      if (!c.ok) {
        box.innerHTML = `<div class="brk">${c.offer == null ? "공모가와 " : ""}매도 주수·매도가를 넣으면 실제 손익을 계산해요.${isMine(item) ? "" : " (입력하면 ✓ 청약 표시돼요)"}</div>`;
        return;
      }
      const W = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
      box.innerHTML = `<div>내 실제 손익</div><div class="big ${c.profit > 0 ? "gain" : c.profit < 0 ? "loss" : ""}">${escapeHtml(fmtWon(c.profit))}</div>` +
        `<div class="brk">${c.shares.toLocaleString("ko-KR")}주 × (평균 매도가 ${W(c.avg)} − 공모가 ${W(c.offer)}) = ${escapeHtml(fmtWon(c.gross))}<br>` +
        `− 청약수수료 ${c.fee != null ? W(c.fee) : "0원(미입력)"}` +
        (costCfg.on ? `<br>− 증권거래세 ${W(c.tax)} (0.20%) − 매도수수료 ${W(c.sellFee)} (${Number(costCfg.feePct) || 0}%)` : `<br>매도 비용 미반영`) + `</div>`;
    }
    function persistFromSheet() {
      const item = items.find((it) => itemKey(it) === sheetKey);
      if (!item) return;
      const sheet = document.getElementById("sheet");
      const prev = myRecord(item);
      const sells = [...sheet.querySelectorAll(".sell-row")].map((row) => ({
        shares: num(row.querySelector('[data-f="shares"]').value),
        price: num(row.querySelector('[data-f="price"]').value),
        orderNo: row.getAttribute("data-order") || null,
        fillKey: row.getAttribute("data-fill") || null,
        time: row.getAttribute("data-time") || null,
      }));
      const depEl = sheet.querySelector("[data-dep]");
      const rec = { sells, fee: num(sheet.querySelector('[data-f="fee"]').value), offer: num(sheet.querySelector('[data-f="offer"]').value), deposit: depEl ? num(depEl.value) : prev.deposit };
      myMap[itemKey(item)] = rec;
      saveMy();
      if (sells.some((x) => x.shares > 0) && !isMine(item)) {
        setMine(itemKey(item), true);
        const t = sheet.querySelector(".sheet-head .sub-toggle");
        if (t) { t.classList.add("on"); t.setAttribute("aria-pressed", "true"); }
      }
      renderMyCalcBox(item);
      const mb = document.getElementById("moneyInfo");
      if (mb) mb.innerHTML = moneyInfoHtml(item);
      renderCalendar();
      renderUpcoming();
      renderMyTotal();
    }
    function recSectionHtml(item) {
      const r = recInfo(item);
      const d = item.demand || {};
      return `<div class="sheet-sec"><h4>청약 판단 (단순 규칙)</h4>` +
        `<div class="rec-head"><span class="rec-badge ${r.cls}">${escapeHtml(r.label)}</span><b>${r.total > 0 ? "+" : ""}${r.total}점</b>` +
        (r.account ? `<span class="kv">${escapeHtml(r.brokers.join("·"))} 계좌 있음</span>` : `<span class="noacct">계좌 없음 (${escapeHtml(r.brokers.join("·"))})</span>`) + `</div>` +
        `<table class="rec-tbl">${r.rows.map((x) => `<tr><td>${escapeHtml(x.k)}</td><td>${escapeHtml(x.val)}</td><td class="pt ${x.pt > 0 ? "plus" : x.pt < 0 ? "minus" : ""}">${x.pt > 0 ? "+" : ""}${x.pt}</td></tr>`).join("")}</table>` +
        `<details class="rule"><summary>규칙 보기</summary>${REC_RULE_HTML}</details>` +
        (d.source ? `<div class="src">출처: <a href="${escapeHtml(d.source)}" target="_blank" rel="noopener">38커뮤니케이션</a>${item.listDateSource ? ` · <a href="${escapeHtml(item.listDateSource)}" target="_blank" rel="noopener">상장일 기사</a>` : ""}</div>` : "") +
        `<div class="disclaim">※ 투자 권유 아님 — 공개 수치로 만든 참고용 점수예요. 판단과 책임은 본인에게 있어요.</div></div>`;
    }
    function moneyInfoHtml(item) {
      const dep = depositOf(item);
      if (!item.refundDate) return `환불일 확인중`;
      const last = addDays(item.refundDate, -1);
      let lastBiz = parseYMD(last); while (!isWeekday(lastBiz)) lastBiz.setDate(lastBiz.getDate() - 1);
      const span = item.subscribeEnd === toDateKey(lastBiz) ? formatYMDKo(item.subscribeEnd) : `${formatYMDKo(item.subscribeEnd)}~${formatYMDKo(toDateKey(lastBiz))}`;
      const m = moneyByDate();
      const same = m.tied[item.subscribeEnd];
      return `환불일 <b>${escapeHtml(formatYMDKo(item.refundDate))}</b> · 증거금 <b>${escapeHtml(fmtMan(dep))}</b> 묶임 <b>${escapeHtml(span)}</b> <span class="kv">(마감일 청약 가정)</span>` +
        (isMine(item) && same ? `<br>${escapeHtml(formatYMDKo(item.subscribeEnd))} ✓종목 묶인 돈 합계 <b>${escapeHtml(fmtMan(same.sum))}</b> (${escapeHtml(same.items.map((x) => x.name).join("·"))})` : isMine(item) ? "" : `<br><span class="kv">✓ 표시하면 달력의 날짜별 '묶인 돈'에 합산돼요.</span>`) +
        `<div class="hint">💡 ${reuseHint(item)}</div>`;
    }
    function moneySectionHtml(item, rec) {
      const minDep = parseWon(item.minDeposit);
      return `<div class="sheet-sec"><h4>환불일 · 묶인 돈</h4><div class="money-box"><div id="moneyInfo">${moneyInfoHtml(item)}</div>` +
        `<label>내 청약 증거금 (원) — 비우면 최소증거금<input type="number" inputmode="numeric" min="0" step="1000" data-dep value="${escapeHtml(v(rec.deposit))}" placeholder="${minDep != null ? minDep.toLocaleString("ko-KR") + " (최소)" : "확인중"}"></label></div></div>`;
    }
    document.getElementById("sheetBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "sheetBackdrop" || e.target.closest(".sheet-close")) { closeSheet(); return; }
      const nav = e.target.closest("[data-sum-nav]");
      if (nav) {
        sumM += Number(nav.getAttribute("data-sum-nav"));
        if (sumM < 0) { sumM = 11; sumY -= 1; } else if (sumM > 11) { sumM = 0; sumY += 1; }
        renderSheet(); return;
      }
      const pb = e.target.closest("[data-paste]");
      if (pb) {
        const ta = document.getElementById("pasteBox");
        if (pb.getAttribute("data-paste") === "parse") {
          pasteText = ta ? ta.value : "";
          pasteFills = parseFillMessages(pasteText);
          pasteMsg = pasteFills.length ? "" : "읽을 수 있는 체결 문자가 없어요.";
        } else {
          const n = applyFills(pasteFills);
          pasteFills = []; pasteText = "";
          pasteMsg = `${n}건을 내 매도에 추가했어요.`;
          renderAll();
        }
        renderSheet(); return;
      }
      const yt = e.target.closest("[data-yt-btn]");
      if (yt) {
        const item = items.find((it) => itemKey(it) === sheetKey);
        openYoutubeApp(e, yt.getAttribute("data-yt-btn"), item);
        return;
      }
      const item = items.find((it) => itemKey(it) === sheetKey);
      if (!item) return;
      if (e.target.closest(".row-add")) {
        persistFromSheet();
        myMap[itemKey(item)].sells.push({ shares: null, price: null });
        saveMy(); renderSheet();
        const rows = document.querySelectorAll("#sheet .sell-row");
        const last = rows[rows.length - 1];
        if (last) last.querySelector("input").focus();
        return;
      }
      const del = e.target.closest("[data-del]");
      if (del) {
        persistFromSheet();
        const rec = myMap[itemKey(item)];
        rec.sells.splice(Number(del.getAttribute("data-del")), 1);
        saveMy(); renderSheet(); renderAll();
        return;
      }
      if (e.target.closest(".my-clear")) {
        delete myMap[itemKey(item)];
        saveMy(); renderSheet(); renderAll();
      }
    });
    document.getElementById("sheet").addEventListener("input", (e) => {
      const t = e.target;
      if (t.matches("[data-cost]")) {
        const k = t.getAttribute("data-cost");
        if (k === "on") costCfg.on = t.checked;
        else costCfg.feePct = num(t.value) ?? 0;
        saveCost();
        const item = items.find((it) => itemKey(it) === sheetKey);
        if (item) renderMyCalcBox(item);
        renderCalendar(); renderMyTotal();
        return;
      }
      if (t.matches("[data-f]") || t.matches("[data-dep]")) persistFromSheet();
      if (t.id === "pasteBox") pasteText = t.value;
    });
    document.getElementById("sheet").addEventListener("change", (e) => {
      const pick = e.target.closest("[data-pv-pick]");
      if (pick) {
        const f = pasteFills[Number(pick.getAttribute("data-pv-pick"))];
        const item = items.find((x) => itemKey(x) === pick.value);
        if (f && item) {
          f.itemId = itemKey(item);
          const dup = existingFillKeys(item).has(f.fillKey) || pasteFills.some((g) => g !== f && g.status === "ok" && g.itemId === f.itemId && g.fillKey === f.fillKey);
          f.status = dup ? "dup" : "ok"; f.why = dup ? "이미 추가된 주문번호" : "직접 선택";
          const ta = document.getElementById("pasteBox"); if (ta) pasteText = ta.value;
          renderSheet();
        }
        return;
      }
      if (e.target.matches('[data-cost="on"]')) e.target.dispatchEvent(new Event("input", { bubbles: true }));
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && sheetMode) closeSheet();
    });
    // 카드 탭 → 상세 패널 (✓ 토글은 캡처 단계에서 먼저 처리되어 여기까지 오지 않음)
    document.getElementById("calendar").addEventListener("click", (e) => {
      const card = e.target.closest(".ipo-card[data-open]");
      if (!card) return;
      openSheet(card.getAttribute("data-open"), card.getAttribute("data-type"));
    });
    document.getElementById("calendar").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (e.target.closest(".sub-toggle")) return;
      const card = e.target.closest(".ipo-card[data-open]");
      if (!card) return;
      e.preventDefault();
      openSheet(card.getAttribute("data-open"), card.getAttribute("data-type"));
    });

    function renderAll() {
      renderCalendar();
      renderUpcoming();
      renderMyTotal();
      if (sheetKey) {
        const t = document.querySelector("#sheet .sheet-head .sub-toggle");
        const item = items.find((it) => itemKey(it) === sheetKey);
        if (t && item) { const on = isMine(item); t.classList.toggle("on", on); t.setAttribute("aria-pressed", String(on)); }
      }
      const f = document.getElementById("mineOnly");
      f.setAttribute("aria-pressed", String(mineOnly));
      const st = document.getElementById("status");
      if (items.length && !st.classList.contains("error")) {
        const n = items.filter(isMine).length;
        st.textContent = mineOnly ? `청약한 종목 ${n}개만 표시 중` : `${items.length}개 종목 표시 중 · 내가 청약 ${n}개`;
      }
    }

    function handleMineToggle(e) {
      const t = e.target.closest && e.target.closest(".sub-toggle[data-mine-id]");
      if (!t) return false;
      e.preventDefault();
      e.stopPropagation();
      const k = t.getAttribute("data-mine-id");
      const item = items.find((it) => itemKey(it) === k);
      setMine(k, !(item ? isMine(item) : t.classList.contains("on")));
      renderAll();
      const again = document.querySelector(`.sub-toggle[data-mine-id="${CSS.escape(k)}"]`);
      if (again && e.type === "keydown") again.focus();
      return true;
    }
    // 캡처 단계에서 처리 → 카드의 유튜브 링크 이동보다 먼저 막음
    document.addEventListener("click", handleMineToggle, true);
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".sub-toggle")) handleMineToggle(e);
    }, true);
    document.getElementById("myTotal").addEventListener("click", () => openTool("summary"));
    document.querySelector(".actions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tool]");
      if (b) openTool(b.getAttribute("data-tool"));
    });
    document.getElementById("mineOnly").addEventListener("click", () => {
      mineOnly = !mineOnly;
      try { localStorage.setItem(MINE_FILTER_KEY, mineOnly ? "1" : "0"); } catch {}
      renderAll();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      viewMonth -= 1;
      if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      viewMonth += 1;
      if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
      renderCalendar();
    });

    async function loadData() {
      const status = document.getElementById("status");
      try {
        const res = await fetch("./data/ipos.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        items = (Array.isArray(data.items) ? data.items : []).filter((it) => {
          const n = String(it.name || "");
          const id = String(it.id || "");
          return !n.includes("실권") && !id.includes("rights");
        });
        document.getElementById("updatedAt").textContent = formatUpdatedAt(data.updatedAt || "");
        // Default view: current month (today, KST on user's device)
        const nowD = new Date();
        viewYear = nowD.getFullYear();
        viewMonth = nowD.getMonth();
        status.classList.remove("error");
        renderAll();
      } catch (err) {
        document.getElementById("updatedAt").textContent = "데이터를 불러오지 못했습니다";
        status.textContent = "ipos.json을 불러올 수 없습니다. HTTP 서버로 열어 주세요.";
        status.classList.add("error");
        console.error(err);
        renderAll();
      }
    }


    document.addEventListener("click", (e) => {
      const a = e.target.closest("a.ipo-card[data-yt], .upcoming-item a[data-yt]");
      if (!a) return;
      const url = a.getAttribute("data-yt");
      if (!url) return;
      const idAttr = a.getAttribute("data-id");
      const item = (items || []).find((it) => it.id === idAttr) || (items || []).find((it) => (it.videoUrl || "") === url);
      openYoutubeApp(e, url, item);
    });

    loadData();
  </script>
</body>
</html>
