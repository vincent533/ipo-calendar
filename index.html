<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공모주 달력</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1a2332;
      --muted: #6b7a8d;
      --border: #e2e8f0;
      --subscribe: #dbeafe;
      --subscribe-border: #60a5fa;
      --subscribe-text: #1e3a8a;
      --subscribe-strong: #2563eb;
      --listing: #dcfce7;
      --listing-border: #4ade80;
      --listing-text: #14532d;
      --listing-strong: #16a34a;
      --mine: #f59e0b;
      --today: #eff6ff;
      --today-ring: #3b82f6;
      --shadow: 0 1px 3px rgba(26, 35, 50, 0.06);
      --radius: 12px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.45rem;
      box-shadow: var(--shadow);
    }

    .toolbar button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.05rem;
      display: grid;
      place-items: center;
      transition: background 0.15s ease;
    }

    .toolbar button:hover { background: var(--bg); }
    .toolbar button:focus-visible {
      outline: 2px solid var(--today-ring);
      outline-offset: 1px;
    }

    .month-label {
      min-width: 8.5rem;
      text-align: center;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .dot.subscribe { background: var(--subscribe); border-color: var(--subscribe-border); }
    .dot.listing { background: var(--listing); border-color: var(--listing-border); }

    .layout {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .layout { grid-template-columns: 1fr 280px; align-items: start; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      max-width: 100%;
    }

    #calendarPanel {
      width: 100%;
      min-width: 0;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    .weekdays div { padding: 0.55rem 0.15rem; min-width: 0; }
    .calendar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
    }

    .day {
      min-width: 0;
      min-height: 7.2rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.3rem 0.2rem 0.35rem;
      background: var(--surface);
      vertical-align: top;
      overflow: hidden;
    }

    .day:nth-child(5n) { border-right: none; }
    .day.outside { background: #fafbfc; color: #a0aec0; }
    .day.today { background: var(--today); box-shadow: inset 0 0 0 1.5px var(--today-ring); }

    .day-num {
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      padding: 0 0.15rem;
    }

    .day.outside .day-num { color: #a0aec0; }

    .cards { display: flex; flex-direction: column; gap: 0.25rem; }

    .ipo-card {
      border-radius: 7px;
      border: 1px solid transparent;
      padding: 0.28rem 0.3rem;
      font-size: 0.68rem;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
      max-width: 100%;
      min-width: 0;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: default;
    }

    a.ipo-card {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a.ipo-card:hover {
      filter: brightness(0.97);
    }

    a.ipo-card:active {
      transform: scale(0.98);
    }

    .ipo-card.subscribe {
      background: var(--subscribe);
      border-color: var(--subscribe-border);
      color: var(--subscribe-text);
    }

    .ipo-card.listing {
      background: var(--listing);
      border-color: var(--listing-border);
      color: var(--listing-text);
    }

    .ipo-card .name {
      font-weight: 700;
      font-size: 0.7rem;
      margin-bottom: 0.08rem;
    }

    .ipo-card .meta-line {
      opacity: 0.92;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .ipo-card .result-line {
      margin-top: 0.12rem;
      padding-top: 0.1rem;
      border-top: 1px dashed currentColor;
      font-weight: 700;
      font-size: 0.62rem;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    .ipo-card .result-line.gain { color: #dc2626; }
    .ipo-card .result-line.loss { color: #2563eb; }
    .ipo-card .result-line.pending, .ipo-card .result-line.flat { opacity: 0.75; font-weight: 600; }

    .side { padding: 1rem; }
    .side h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .upcoming-section { margin-bottom: 1.1rem; }
    .upcoming-section:last-child { margin-bottom: 0; }

    .upcoming-label {
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .upcoming-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }

    .upcoming-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      font-size: 0.8rem;
      background: #fbfcfe;
    }

    .upcoming-item .u-name { font-weight: 700; margin-bottom: 0.15rem; }
    .upcoming-item .u-detail { color: var(--muted); font-size: 0.74rem; }
    .upcoming-item.empty { color: var(--muted); border-style: dashed; }

    .status {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: #b91c1c; }

    /* 내가 청약한 종목 */
    .ipo-card { position: relative; }
    .ipo-card .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.15rem;
    }
    .ipo-card .name-row .name { min-width: 0; }
    .sub-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.05rem;
      height: 1.05rem;
      padding: 0 0.15rem;
      border-radius: 999px;
      border: 1.5px solid currentColor;
      background: rgba(255,255,255,0.75);
      color: inherit;
      opacity: 0.45;
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .sub-toggle { position: relative; }
    .sub-toggle::after { content: ""; position: absolute; inset: -6px; } /* 모바일 탭 영역 확대 */
    .sub-toggle:hover { opacity: 0.8; }
    .sub-toggle:focus-visible { outline: 2px solid var(--today-ring); outline-offset: 1px; }
    .sub-toggle .lbl { display: none; }
    .sub-toggle.on {
      opacity: 1;
      background: #f59e0b;
      border-color: #d97706;
      color: #fff;
    }
    .sub-toggle.on .lbl { display: inline; margin-left: 0.08rem; }
    .ipo-card.mine {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1.5px #f59e0b;
      background-image: linear-gradient(rgba(254, 243, 199, 0.55), rgba(254, 243, 199, 0.55));
    }
    .upcoming-item { position: relative; }
    .upcoming-item .u-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; }
    .upcoming-item .sub-toggle { min-width: 1.35rem; height: 1.35rem; font-size: 0.72rem; color: var(--muted); }
    .upcoming-item .sub-toggle.on { color: #fff; }
    .upcoming-item.mine { border-color: #f59e0b; box-shadow: 0 0 0 1.5px #f59e0b; background: #fffbeb; }
    .filter-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-left: auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .filter-toggle[aria-pressed="true"] { background: #f59e0b; border-color: #d97706; color: #fff; font-weight: 700; }
    .dot.mine { background: #fff; border-color: #f59e0b; border-width: 2px; }
    .dot.subscribe { border-left: 3px solid var(--subscribe-strong); }
    .dot.listing { border-left: 3px solid var(--listing-strong); }

    @media (max-width: 640px) {
      .sub-toggle { min-width: 0.85rem; height: 0.85rem; font-size: 0.5rem; padding: 0 0.1rem; border-width: 1px; }
      .sub-toggle .lbl { font-size: 0.48rem; }
      .legend { align-items: center; }
      .filter-toggle { font-size: 0.74rem; padding: 0.28rem 0.6rem; }
    }

    @media (max-width: 640px) {
      .wrap { padding: 0.75rem 0.4rem 2rem; }
      h1 { font-size: 1.25rem; }
      .day { min-height: 5.2rem; padding: 0.2rem 0.1rem 0.25rem; }
      .day-num { font-size: 0.7rem; padding: 0 0.1rem; }
      .ipo-card { font-size: 0.56rem; padding: 0.18rem 0.18rem; }
      .ipo-card .name { font-size: 0.58rem; }
      .ipo-card .meta-line { font-size: 0.52rem; line-height: 1.3; }
      .ipo-card .result-line { font-size: 0.5rem; line-height: 1.3; }
      .weekdays { font-size: 0.65rem; }
      .weekdays div { padding: 0.45rem 0.05rem; }
      .month-label { min-width: 6.5rem; font-size: 0.92rem; }
      .cards { gap: 0.18rem; }
    }

    /* ---- 카드 종류 구분 (청약=파랑, 상장=초록) ---- */
    .ipo-card.subscribe { border-left: 3px solid var(--subscribe-strong); }
    .ipo-card.listing { border-left: 3px solid var(--listing-strong); }
    .type-badge {
      display: inline-block;
      flex: none;
      padding: 0 0.22rem;
      margin-right: 0.15rem;
      border-radius: 4px;
      font-size: 0.56rem;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      vertical-align: 1px;
      letter-spacing: -0.02em;
    }
    .type-badge.subscribe { background: var(--subscribe-strong); }
    .type-badge.listing { background: var(--listing-strong); }
    .type-badge .b-short { display: none; }
    .ipo-card.mine {
      border-color: var(--mine);
      border-left-width: 3px;
      box-shadow: 0 0 0 2px var(--mine);
      background-image: none;
    }
    .ipo-card.subscribe.mine { border-left-color: var(--subscribe-strong); background: #dbeafe; }
    .ipo-card.listing.mine { border-left-color: var(--listing-strong); background: #dcfce7; }
    .ipo-card .sub-toggle.on .lbl { display: none; }
    .ipo-card { cursor: pointer; }
    .ipo-card:focus-visible { outline: 2px solid var(--today-ring); outline-offset: 1px; }
    .ipo-card .my-line {
      margin-top: 0.1rem;
      padding: 0.05rem 0.2rem;
      border-radius: 4px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      font-weight: 800;
      font-size: 0.62rem;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .ipo-card .my-line.gain b { color: #dc2626; }
    .ipo-card .my-line.loss b { color: #2563eb; }
    .legend .badge-sample { display: inline-flex; align-items: center; gap: 0.25rem; }
    .my-total {
      display: inline-flex; align-items: center; gap: 0.3rem;
      border: 1px solid #fdba74; background: #fff7ed; color: #9a3412;
      border-radius: 999px; padding: 0.25rem 0.65rem; font-size: 0.8rem; font-weight: 700;
    }
    .my-total b.gain { color: #dc2626; }
    .my-total b.loss { color: #2563eb; }
    .my-total[hidden] { display: none; }

    /* ---- 상세 패널 ---- */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .sheet-backdrop[hidden] { display: none; }
    .sheet {
      background: var(--surface); color: var(--text);
      width: min(520px, 100%); max-height: calc(100vh - 2rem); overflow: auto;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(15,23,42,0.25);
      padding: 1rem 1rem 1.2rem; font-size: 0.86rem;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-head { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
    .sheet-head h3 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 0; letter-spacing: -0.02em; }
    .sheet-head .type-badge { font-size: 0.72rem; padding: 0.05rem 0.35rem; }
    .sheet-close {
      appearance: none; border: none; background: #f1f5f9; border-radius: 999px;
      width: 2rem; height: 2rem; font-size: 1.1rem; cursor: pointer; flex: none; color: var(--text);
    }
    .sheet .sub-toggle { min-width: 2rem; height: 2rem; font-size: 0.85rem; color: var(--muted); opacity: 0.7; }
    .sheet .sub-toggle.on { color: #fff; opacity: 1; }
    .sheet .sub-toggle .lbl { display: none; }
    .sheet .sub-toggle.on .lbl { display: inline; margin-left: 0.15rem; }
    .sheet-sec { border-top: 1px solid var(--border); padding-top: 0.7rem; margin-top: 0.7rem; }
    .sheet-sec h4 { font-size: 0.86rem; font-weight: 800; margin-bottom: 0.4rem; }
    .sheet .kv { color: var(--muted); font-size: 0.8rem; }
    .sheet .kv b { color: var(--text); font-weight: 650; }
    .sheet ul.lines { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.82rem; }
    .sheet .src { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; }
    .sheet .src a { color: var(--muted); }
    .sheet .yt-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      margin-top: 0.6rem; padding: 0.55rem; border-radius: 10px;
      background: #ef4444; color: #fff; font-weight: 750; text-decoration: none; font-size: 0.86rem;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem 0.6rem; }
    .form-grid label, .sell-row label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.74rem; color: var(--muted); }
    .sheet input[type="number"], .sheet input[type="text"] {
      font: inherit; font-size: 16px; /* iOS 확대 방지 */
      padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 8px; width: 100%;
      color: var(--text); background: #fff;
    }
    .sell-rows { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.5rem 0 0.35rem; }
    .sell-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 0.45rem; align-items: end; }
    .row-del, .row-add, .my-clear {
      appearance: none; font: inherit; font-size: 0.8rem; cursor: pointer;
      border: 1px solid var(--border); background: #f8fafc; border-radius: 8px; padding: 0.42rem 0.6rem; color: var(--text);
    }
    .row-del { padding: 0.42rem 0.55rem; }
    .cost-box { margin-top: 0.55rem; padding: 0.5rem 0.6rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; font-size: 0.78rem; }
    .cost-box .chk { display: flex; align-items: center; gap: 0.35rem; font-weight: 650; color: var(--text); }
    .cost-box .rate { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; color: var(--muted); }
    .cost-box .rate input { width: 6.5rem; }
    .my-calc { margin-top: 0.6rem; padding: 0.6rem; border-radius: 10px; background: #fff7ed; border: 1px solid #fdba74; }
    .my-calc .big { font-size: 1.15rem; font-weight: 850; }
    .my-calc .big.gain { color: #dc2626; }
    .my-calc .big.loss { color: #2563eb; }
    .my-calc .brk { font-size: 0.75rem; color: #7c2d12; margin-top: 0.2rem; line-height: 1.5; }
    .my-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.72rem; color: var(--muted); }
    @media (max-width: 640px) {
      .sheet-backdrop { align-items: flex-end; padding: 0; }
      .sheet { width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; padding: 0.9rem 0.9rem calc(1.1rem + env(safe-area-inset-bottom)); }
      .type-badge { font-size: 0.46rem; padding: 0 0.12rem; margin-right: 0.08rem; border-radius: 3px; }
      .type-badge .b-long { display: none; }
      .type-badge .b-short { display: inline; }
      .sheet .type-badge .b-long { display: inline; }
      .sheet .type-badge .b-short { display: none; }
      .ipo-card.subscribe, .ipo-card.listing { border-left-width: 2.5px; }
      .ipo-card.mine { box-shadow: 0 0 0 1.5px var(--mine); }
      .ipo-card .my-line { font-size: 0.5rem; padding: 0.03rem 0.1rem; }
      .my-total { font-size: 0.72rem; padding: 0.22rem 0.55rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>공모주 달력</h1>
        <p class="meta" id="updatedAt">데이터 불러오는 중…</p>
      </div>
      <div class="toolbar" role="group" aria-label="월 이동">
        <button type="button" id="prevMonth" aria-label="이전 달">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button type="button" id="nextMonth" aria-label="다음 달">›</button>
      </div>
    </header>

    <div class="legend">
      <span class="badge-sample"><span class="type-badge subscribe"><span class="b-long">청약</span><span class="b-short">청</span></span> 청약 마감일 (파랑)</span>
      <span class="badge-sample"><span class="type-badge listing"><span class="b-long">상장</span><span class="b-short">상</span></span> 상장일 (초록)</span>
      <span aria-hidden="true"><i class="dot mine"></i> 주황 테두리 = 내가 청약 (✓)</span>
      <span aria-hidden="true">카드 탭 → 상세·내 매도 입력</span>
      <span class="my-total" id="myTotal" hidden></span>
      <button type="button" class="filter-toggle" id="mineOnly" aria-pressed="false">✓ 청약한 종목만</button>
    </div>

    <div class="layout">
      <div class="panel" id="calendarPanel">
        <div class="weekdays">
          <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
        </div>
        <div class="calendar" id="calendar"></div>
      </div>

      <aside class="panel side">
        <h2>다가오는 일정</h2>
        <div class="upcoming-section">
          <div class="upcoming-label"><i class="dot subscribe"></i> 청약</div>
          <ul class="upcoming-list" id="upcomingSubscribe"></ul>
        </div>
        <div class="upcoming-section">
          <div class="upcoming-label"><i class="dot listing"></i> 상장</div>
          <ul class="upcoming-list" id="upcomingListing"></ul>
        </div>
      </aside>
    </div>

    <p class="status" id="status"></p>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>

  <script>
    const WEEKDAYS_KO = ["일", "월", "화", "수", "목", "금", "토"];

    let items = [];
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth(); // default: current month

    // ---- 내가 청약한 종목 (localStorage, 기기·브라우저별) ----
    const MINE_KEY = "ipoCalendar.mine.v1";
    const MINE_FILTER_KEY = "ipoCalendar.mineOnly.v1";
    function loadMine() {
      try { return JSON.parse(localStorage.getItem(MINE_KEY) || "{}") || {}; } catch { return {}; }
    }
    let mineMap = loadMine();
    let mineOnly = false;
    try { mineOnly = localStorage.getItem(MINE_FILTER_KEY) === "1"; } catch {}
    function itemKey(item) { return String((item && (item.id || item.name)) || ""); }
    function isMine(item) {
      const k = itemKey(item);
      if (Object.prototype.hasOwnProperty.call(mineMap, k)) return mineMap[k] === true; // 명시적 설정(해제 포함) 우선
      return item.subscribed === true;
    }
    function setMine(k, on) {
      mineMap[k] = !!on;
      try { localStorage.setItem(MINE_KEY, JSON.stringify(mineMap)); } catch {}
    }
    function toggleHtml(item) {
      const on = isMine(item);
      return `<span class="sub-toggle${on ? " on" : ""}" role="button" tabindex="0" data-mine-id="${escapeHtml(itemKey(item))}" aria-pressed="${on}" aria-label="${escapeHtml(item.name)} 청약함 표시" title="${on ? "청약함 (눌러서 해제)" : "청약했으면 눌러서 표시"}">✓<span class="lbl">청약</span></span>`;
    }

    function pad2(n) { return String(n).padStart(2, "0"); }

    function toDateKey(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function parseYMD(s) {
      if (!s) return new Date(NaN);
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatYMDKo(s) {
      const d = parseYMD(s);
      return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS_KO[d.getDay()]})`;
    }

    function formatUpdatedAt(iso) {
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const y = d.getFullYear();
        const m = pad2(d.getMonth() + 1);
        const day = pad2(d.getDate());
        const h = pad2(d.getHours());
        const mi = pad2(d.getMinutes());
        return `데이터 갱신: ${y}-${m}-${day} ${h}:${mi}`;
      } catch {
        return `데이터 갱신: ${iso}`;
      }
    }

    function displayScore(score) {
      if (score === null || score === undefined || score === "" || score === "없음") return "없음";
      return String(score);
    }

    function displayDeposit(dep) {
      if (dep === null || dep === undefined || dep === "" || dep === "미확인") return "미확인";
      return String(dep);
    }

    function abbreviateBroker(name) {
      const s = String(name || "").trim();
      if (!s) return "";
      const map = [
        [/미래에셋/, "미래"],
        [/유진투자|유진/, "유진"],
        [/대신/, "대신"],
        [/키움/, "키움"],
        [/한국투자|한투/, "한투"],
        [/NH투자|^NH$|나무/, "NH"],
        [/^KB|KB증권/, "KB"],
        [/신한/, "신한"],
        [/삼성/, "삼성"],
        [/유안타/, "유안타"],
        [/상상인/, "상상인"],
        [/IBK/, "IBK"],
        [/하나/, "하나"],
        [/한양/, "한양"],
      ];
      for (const [re, short] of map) {
        if (re.test(s)) return short;
      }
      return s.replace(/증권|투자증권/g, "").trim() || s;
    }

    function displayBrokers(item) {
      const raw = item.brokers;
      if (!raw || (Array.isArray(raw) && raw.length === 0)) return "";
      const list = Array.isArray(raw) ? raw : String(raw).split(/[,·\/]/);
      const shorts = [...new Set(list.map((x) => abbreviateBroker(x)).filter(Boolean))];
      return shorts.join("·");
    }

    function eachDateInclusive(startStr, endStr) {
      const out = [];
      let cur = parseYMD(startStr);
      const end = parseYMD(endStr);
      while (cur <= end) {
        out.push(toDateKey(cur));
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      }
      return out;
    }

    function eventsForDate(dateKey) {
      const events = [];
      for (const item of items) {
        if (mineOnly && !isMine(item)) continue;
        // 청약은 기간의 마지막 날만 표시
        if (item.subscribeEnd === dateKey) {
          events.push({ type: "subscribe", item });
        }
        if (item.listDate === dateKey) {
          events.push({ type: "listing", item });
        }
      }
      return events;
    }

    function extractYoutubeId(url) {
      if (!url) return "";
      const s = String(url).trim();
      let m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/youtube\.com\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/^([A-Za-z0-9_-]{11})$/);
      return m ? m[1] : "";
    }

    function extractStartSeconds(url, item) {
      if (item && item.videoStartSeconds != null && item.videoStartSeconds !== "") {
        const n = Number(item.videoStartSeconds);
        if (!Number.isNaN(n) && n >= 0) return Math.floor(n);
      }
      if (!url) return 0;
      const s = String(url);
      let m = s.match(/[?&]t=(\d+)s?/i);
      if (m) return parseInt(m[1], 10);
      m = s.match(/[?&]start=(\d+)/i);
      if (m) return parseInt(m[1], 10);
      m = s.match(/[?&]t=(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if (m && (m[1] || m[2] || m[3])) {
        return (parseInt(m[1] || "0", 10) * 3600) + (parseInt(m[2] || "0", 10) * 60) + parseInt(m[3] || "0", 10);
      }
      return 0;
    }

    function youtubeWebUrl(id, startSec) {
      if (startSec && startSec > 0) return `https://youtu.be/${id}?t=${startSec}`;
      return `https://youtu.be/${id}`;
    }

    function youtubeAppHref(url, item) {
      const id = extractYoutubeId(url);
      if (!id) return url || "#";
      const startSec = extractStartSeconds(url, item);
      return youtubeWebUrl(id, startSec);
    }

    function openYoutubeApp(event, url, item) {
      const id = extractYoutubeId(url);
      if (!id) return;
      event.preventDefault();
      const ua = navigator.userAgent || "";
      const startSec = extractStartSeconds(url, item);
      // youtu.be?t= 초 단위가 앱·웹 모두에서 시점을 가장 잘 지킴
      const stamped = youtubeWebUrl(id, startSec);
      if (/Android/i.test(ua)) {
        const tQuery = startSec > 0 ? `&t=${startSec}` : "";
        window.location.href =
          `intent://www.youtube.com/watch?v=${id}${tQuery}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(stamped)};end`;
        return;
      }
      // iOS/기타: 유니버설 링크로 앱 실행 + 시점 유지
      window.location.href = stamped;
    }

    function fmtWon(n) {
      const v = Math.round(n);
      return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("ko-KR") + "원";
    }
    function fmtPct(p) {
      return (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(p).toFixed(1).replace(/\.0$/, "") + "%";
    }
    function fmtShares(n) {
      return Number.isInteger(n) ? `${n}주` : `${n}주`;
    }
    // 상장 결과: 시초가 수익률 · 최소청약 기준 균등 배정 · 수수료 차감 손익
    function resultInfo(item) {
      const r = item.result;
      const todayKey = toDateKey(new Date());
      if (!r) {
        if (item.listDate && item.listDate <= todayKey) {
          return { short: "결과 확인중", detail: "상장 결과 확인중", cls: "pending" };
        }
        return null;
      }
      const parts = [];
      const det = [];
      if (r.openReturnPct != null) {
        parts.push(`시초 ${fmtPct(r.openReturnPct)}`);
        det.push(`공모가 ${Number(r.offerPrice).toLocaleString("ko-KR")}원 → 시초가 ${Number(r.openPrice).toLocaleString("ko-KR")}원 (${fmtPct(r.openReturnPct)})`);
      } else {
        parts.push("시초 확인중");
      }
      if (r.allottedShares != null) {
        parts.push(`${fmtShares(r.allottedShares)}${r.lottery ? "(추첨)" : ""}`);
        det.push(`최소청약 ${r.minShares != null ? r.minShares + "주" : "확인중"} 기준 배정: ${r.allotmentNote || fmtShares(r.allottedShares)}`);
      } else {
        parts.push("배정 확인중");
      }
      if (r.fee != null) {
        let f = `청약수수료 ${r.feeBroker || ""} ${Number(r.fee).toLocaleString("ko-KR")}원`;
        f += r.feeWaivedIfNotAllotted ? " (미배정 시 면제" : " (청약 건당";
        if (r.feeExpected != null && r.feeExpected !== r.fee) f += `, 기대 ${Number(r.feeExpected).toLocaleString("ko-KR")}원`;
        det.push(f + ")");
      } else {
        det.push(`청약수수료 ${r.feeBroker || ""} 확인중 (손익은 수수료 차감 전)`);
      }
      let cls = "pending";
      if (r.profitWon != null) {
        parts.push(fmtWon(r.profitWon) + (r.profitIncludesFee ? "" : "(수수료 확인중)"));
        det.push(`예상 손익(시초가 매도): ${fmtWon(r.profitWon)}${r.profitIncludesFee ? " · 수수료 차감" : " · 수수료 미차감"}${r.lottery ? " · 추첨 포함 기대값" : ""}`);
        cls = r.profitWon > 0 ? "gain" : r.profitWon < 0 ? "loss" : "flat";
      } else {
        parts.push("손익 확인중");
      }
      return { short: parts.join(" · "), detail: det.join("\n"), cls };
    }

    function cardHtml(type, item) {
      const cls = (type === "subscribe" ? "subscribe" : "listing") + (isMine(item) ? " mine" : "");
      const score = displayScore(item.score);
      const deposit = displayDeposit(item.minDeposit);
      const brokers = displayBrokers(item);
      const meta = brokers
        ? `${escapeHtml(deposit)} · ${escapeHtml(score)} · ${escapeHtml(brokers)}`
        : `${escapeHtml(deposit)} · ${escapeHtml(score)}`;
      const res = type === "listing" ? resultInfo(item) : null;
      const my = type === "listing" && isMine(item) ? myCalc(item) : null;
      const badge = type === "subscribe"
        ? `<span class="type-badge subscribe"><span class="b-long">청약</span><span class="b-short">청</span></span>`
        : `<span class="type-badge listing"><span class="b-long">상장</span><span class="b-short">상</span></span>`;
      const inner =
        `<div class="name-row"><div class="name">${badge}${escapeHtml(item.name)}</div>${toggleHtml(item)}</div>` +
        `<div class="meta-line">${meta}</div>` +
        (res ? `<div class="result-line ${res.cls}">${res.cls === "pending" ? "" : "예상 "}${escapeHtml(res.short)}</div>` : "") +
        (my && my.ok ? `<div class="my-line ${my.profit > 0 ? "gain" : my.profit < 0 ? "loss" : ""}">내 손익 <b>${escapeHtml(fmtWon(my.profit))}</b></div>` : "");
      const tip = `${type === "subscribe" ? "[청약 마감]" : "[상장]"} ${item.name} · 탭하면 상세`;
      return (
        `<div class="ipo-card ${cls}" role="button" tabindex="0" data-open="${escapeHtml(itemKey(item))}" data-type="${type}" title="${escapeHtml(tip)}">` +
        inner +
        `</div>`
      );
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isWeekday(d) {
      const dow = d.getDay();
      return dow >= 1 && dow <= 5;
    }

    function renderCalendar() {
      const label = document.getElementById("monthLabel");
      label.textContent = `${viewYear}년 ${viewMonth + 1}월`;

      const first = new Date(viewYear, viewMonth, 1);
      // Monday of the week that contains the 1st
      const dow = first.getDay();
      const toMon = dow === 0 ? -6 : 1 - dow;
      let cursor = new Date(viewYear, viewMonth, 1 + toMon);

      const last = new Date(viewYear, viewMonth + 1, 0);
      let end = new Date(last);
      const endDow = end.getDay();
      if (endDow === 0) end.setDate(end.getDate() - 2);
      else if (endDow === 6) end.setDate(end.getDate() - 1);
      else end.setDate(end.getDate() + (5 - endDow));

      const todayKey = toDateKey(new Date());
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";

      while (cursor <= end) {
        if (isWeekday(cursor)) {
          const d = new Date(cursor);
          const key = toDateKey(d);
          const outside = d.getMonth() !== viewMonth;
          const cell = document.createElement("div");
          cell.className = "day";
          if (outside) cell.classList.add("outside");
          if (key === todayKey) cell.classList.add("today");

          const events = eventsForDate(key);
          cell.innerHTML =
            `<div class="day-num">${d.getDate()}</div>` +
            `<div class="cards">${events.map((e) => cardHtml(e.type, e.item)).join("")}</div>`;
          cal.appendChild(cell);
        }
        cursor.setDate(cursor.getDate() + 1);
      }
    }

    function renderUpcoming() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const subs = [];
      const lists = [];

      for (const item of items) {
        if (mineOnly && !isMine(item)) continue;
        const subStart = parseYMD(item.subscribeStart);
        const subEnd = parseYMD(item.subscribeEnd);
        if (subEnd >= today) {
          subs.push({ item, sortKey: subStart.getTime() });
        }
        const listD = parseYMD(item.listDate);
        if (listD >= today) {
          lists.push({ item, sortKey: listD.getTime() });
        }
      }

      subs.sort((a, b) => a.sortKey - b.sortKey || a.item.name.localeCompare(b.item.name, "ko"));
      lists.sort((a, b) => a.sortKey - b.sortKey || a.item.name.localeCompare(b.item.name, "ko"));

      const subEl = document.getElementById("upcomingSubscribe");
      const listEl = document.getElementById("upcomingListing");

      subEl.innerHTML = subs.length
        ? subs.slice(0, 8).map(({ item }) => {
            const range =
              item.subscribeStart === item.subscribeEnd
                ? formatYMDKo(item.subscribeStart)
                : `${formatYMDKo(item.subscribeStart)}~${formatYMDKo(item.subscribeEnd)}`;
            return (
              `<li class="upcoming-item${isMine(item) ? " mine" : ""}">${item.videoUrl ? `<a href="${escapeHtml(youtubeAppHref(item.videoUrl, item))}" data-yt="${escapeHtml(item.videoUrl)}" data-id="${escapeHtml(item.id || "")}" style="color:inherit;text-decoration:none;display:block">` : ""}` +
              `<div class="u-head"><div class="u-name">${escapeHtml(item.name)}</div>${toggleHtml(item)}</div>` +
              `<div class="u-detail">${range} · ${escapeHtml(displayDeposit(item.minDeposit))} · ${escapeHtml(displayScore(item.score))}${displayBrokers(item) ? " · " + escapeHtml(displayBrokers(item)) : ""}</div>` +
              `${item.videoUrl ? `</a>` : ""}</li>`
            );
          }).join("")
        : `<li class="upcoming-item empty">예정된 청약 없음</li>`;

      listEl.innerHTML = lists.length
        ? lists.slice(0, 8).map(({ item }) => {
            return (
              `<li class="upcoming-item${isMine(item) ? " mine" : ""}">${item.videoUrl ? `<a href="${escapeHtml(youtubeAppHref(item.videoUrl, item))}" data-yt="${escapeHtml(item.videoUrl)}" data-id="${escapeHtml(item.id || "")}" style="color:inherit;text-decoration:none;display:block">` : ""}` +
              `<div class="u-head"><div class="u-name">${escapeHtml(item.name)}</div>${toggleHtml(item)}</div>` +
              `<div class="u-detail">${formatYMDKo(item.listDate)} · ${escapeHtml(displayDeposit(item.minDeposit))} · ${escapeHtml(displayScore(item.score))}${displayBrokers(item) ? " · " + escapeHtml(displayBrokers(item)) : ""}</div>` +
              `${item.videoUrl ? `</a>` : ""}</li>`
            );
          }).join("")
        : `<li class="upcoming-item empty">예정된 상장 없음</li>`;
    }


    // ---- 내 매도 기록 (localStorage + ipos.json의 my 기본값) ----
    const MY_KEY = "ipoCalendar.my.v1";
    const COST_KEY = "ipoCalendar.sellCost.v1";
    // 2026.1.1 이후 양도분: 코스닥 0.20%, 코스피 0.05%+농특세 0.15% = 0.20% (증권거래세법 시행령 제5조)
    const SELL_TAX_RATE = 0.002;
    const DEFAULT_SELL_FEE_PCT = 0.015; // 매도 수수료율(%) 기본값, 사용자 수정 가능
    // 온라인 청약수수료 기본값(일반 등급, 원) — 배정 시 기준
    const BROKER_SUB_FEE = { 한투: 2000, 미래: 2000, KB: 1500, 신한: 2000, 삼성: 2000, 대신: 2000, NH: 2000, 유진: 2000, 하나: 2000, 한화: 2000, SK: 2000 };
    function loadJSON(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch { return d; } }
    let myMap = loadJSON(MY_KEY, {});
    let costCfg = Object.assign({ on: true, feePct: DEFAULT_SELL_FEE_PCT }, loadJSON(COST_KEY, {}));
    function saveMy() { try { localStorage.setItem(MY_KEY, JSON.stringify(myMap)); } catch {} }
    function saveCost() { try { localStorage.setItem(COST_KEY, JSON.stringify(costCfg)); } catch {} }
    function num(v) { if (v === "" || v == null) return null; const n = Number(String(v).replace(/[,\s원주]/g, "")); return Number.isFinite(n) ? n : null; }
    function jsonMy(item) {
      const m = item.my;
      if (!m || typeof m !== "object") return null;
      let sells = Array.isArray(m.sells) ? m.sells.map((x) => ({ shares: num(x.shares), price: num(x.price ?? x.sellPrice) })) : [];
      if (!sells.length && (m.shares != null || m.sellPrice != null)) sells = [{ shares: num(m.shares), price: num(m.sellPrice) }];
      return { sells, fee: num(m.fee), offer: num(m.offerPrice) };
    }
    function defaultSubFee(item) {
      if (item.result && item.result.fee != null) return item.result.fee;
      const b = (Array.isArray(item.brokers) ? item.brokers : []).map(abbreviateBroker);
      const mine = b.find((x) => BROKER_SUB_FEE[x] != null);
      return mine ? BROKER_SUB_FEE[mine] : null;
    }
    function myRecord(item) {
      const k = itemKey(item);
      const local = myMap[k];
      const fromJson = jsonMy(item);
      const base = local || fromJson || { sells: [], fee: null, offer: null };
      return {
        sells: (base.sells && base.sells.length ? base.sells : [{ shares: null, price: null }]).map((x) => ({ shares: x.shares, price: x.price })),
        fee: base.fee,
        offer: base.offer,
        source: local ? "local" : fromJson ? "json" : "none",
      };
    }
    function offerOf(item, rec) {
      if (rec && rec.offer != null) return rec.offer;
      if (item.result && item.result.offerPrice != null) return item.result.offerPrice;
      return null;
    }
    function myCalc(item) {
      const rec = myRecord(item);
      const offer = offerOf(item, rec);
      const sells = rec.sells.filter((x) => x.shares > 0 && x.price > 0);
      const fee = rec.fee != null ? rec.fee : defaultSubFee(item);
      if (!sells.length || offer == null) return { ok: false, rec, offer, fee };
      let shares = 0, proceeds = 0, tax = 0, sellFee = 0;
      for (const x of sells) {
        const amt = x.shares * x.price;
        shares += x.shares; proceeds += amt;
        tax += Math.floor(amt * SELL_TAX_RATE);
        sellFee += Math.floor(amt * (Number(costCfg.feePct) || 0) / 100);
      }
      const gross = proceeds - shares * offer;
      const costs = costCfg.on ? tax + sellFee : 0;
      const profit = gross - (fee || 0) - costs;
      return { ok: true, rec, offer, fee, shares, proceeds, avg: proceeds / shares, gross, tax, sellFee, costs, profit };
    }
    function renderMyTotal() {
      const el = document.getElementById("myTotal");
      let sum = 0, n = 0;
      for (const it of items) {
        if (!isMine(it)) continue;
        const c = myCalc(it);
        if (c.ok) { sum += c.profit; n += 1; }
      }
      if (!n) { el.hidden = true; return; }
      el.hidden = false;
      el.innerHTML = `내 실제 손익 합계 <b class="${sum > 0 ? "gain" : sum < 0 ? "loss" : ""}">${escapeHtml(fmtWon(sum))}</b> <span style="font-weight:500">(${n}종목)</span>`;
    }

    // ---- 상세 패널 ----
    let sheetKey = null;
    let sheetType = null;
    function openSheet(k, type) {
      sheetKey = k; sheetType = type;
      renderSheet();
      document.getElementById("sheetBackdrop").hidden = false;
      document.body.style.overflow = "hidden";
      const c = document.querySelector("#sheet .sheet-close");
      if (c) c.focus({ preventScroll: true });
    }
    function closeSheet() {
      const k = sheetKey;
      sheetKey = null;
      document.getElementById("sheetBackdrop").hidden = true;
      document.body.style.overflow = "";
      const card = k && document.querySelector(`.ipo-card[data-open="${CSS.escape(k)}"]`);
      if (card) card.focus({ preventScroll: true });
    }
    function v(n) { return n == null ? "" : String(n); }
    function renderSheet() {
      const item = items.find((it) => itemKey(it) === sheetKey);
      const el = document.getElementById("sheet");
      if (!item) { el.innerHTML = ""; return; }
      const isSub = sheetType === "subscribe";
      const range = item.subscribeStart === item.subscribeEnd ? formatYMDKo(item.subscribeStart) : `${formatYMDKo(item.subscribeStart)}~${formatYMDKo(item.subscribeEnd)}`;
      const res = resultInfo(item);
      const r = item.result;
      const rec = myRecord(item);
      const url = item.videoUrl || item.analysisUrl || "";
      const defFee = defaultSubFee(item);
      const offer = offerOf(item, rec);
      let html = `<div class="sheet-head">` +
        `<span class="type-badge ${isSub ? "subscribe" : "listing"}"><span class="b-long">${isSub ? "청약" : "상장"}</span><span class="b-short">${isSub ? "청" : "상"}</span></span>` +
        `<h3 id="sheetTitle">${escapeHtml(item.name)}</h3>${toggleHtml(item)}` +
        `<button type="button" class="sheet-close" aria-label="닫기">×</button></div>` +
        `<div class="kv">청약 <b>${escapeHtml(range)}</b> · 상장 <b>${escapeHtml(item.listDate ? formatYMDKo(item.listDate) : "미정")}</b><br>` +
        `최소증거금 <b>${escapeHtml(displayDeposit(item.minDeposit))}</b> · 점수 <b>${escapeHtml(displayScore(item.score))}</b>${displayBrokers(item) ? ` · <b>${escapeHtml(displayBrokers(item))}</b>` : ""}</div>`;
      if (url) {
        html += `<a class="yt-btn" href="${escapeHtml(youtubeAppHref(url, item))}" data-yt-btn="${escapeHtml(url)}">▶ 공모주린이 종합점수 영상</a>`;
      }
      html += `<div class="sheet-sec"><h4>상장 결과 (예상 · 최소청약 기준)</h4>`;
      if (res && r) {
        html += `<ul class="lines">${res.detail.split("\n").map((l) => `<li>${escapeHtml(l)}</li>`).join("")}</ul>`;
        const src = r.source || {};
        const links = [["가격", src.prices], ["배정", src.allotment], ["수수료", src.fee]].filter((x) => x[1]);
        if (links.length) html += `<div class="src">출처: ${links.map(([n, u]) => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</div>`;
      } else if (res) {
        html += `<div class="kv">결과 확인중</div>`;
      } else {
        html += `<div class="kv">아직 상장 전이에요.</div>`;
      }
      html += `</div>`;
      html += `<div class="sheet-sec"><h4>내 매도 기록 → 실제 손익</h4>` +
        `<div class="form-grid">` +
        `<label>공모가 (원)<input type="number" inputmode="numeric" min="0" data-f="offer" value="${escapeHtml(v(rec.offer))}" placeholder="${escapeHtml(v(r && r.offerPrice) || "공모가")}"></label>` +
        `<label>청약수수료 (원)<input type="number" inputmode="numeric" min="0" data-f="fee" value="${escapeHtml(v(rec.fee))}" placeholder="${defFee != null ? defFee + " (기본)" : "증권사 수수료"}"></label>` +
        `</div><div class="sell-rows">` +
        rec.sells.map((x, i) => `<div class="sell-row" data-i="${i}">` +
          `<label>${i === 0 ? "매도 주수" : `매도 주수 ${i + 1}`}<input type="number" inputmode="numeric" min="0" data-f="shares" value="${escapeHtml(v(x.shares))}" placeholder="주"></label>` +
          `<label>${i === 0 ? "매도가 (원)" : `매도가 ${i + 1}`}<input type="number" inputmode="numeric" min="0" data-f="price" value="${escapeHtml(v(x.price))}" placeholder="원"></label>` +
          `<button type="button" class="row-del" data-del="${i}" aria-label="이 줄 삭제">✕</button></div>`).join("") +
        `</div><button type="button" class="row-add">+ 나눠 판 매도 추가</button>` +
        `<div class="cost-box"><label class="chk"><input type="checkbox" data-cost="on" ${costCfg.on ? "checked" : ""}> 매도 비용 반영 (증권거래세 0.20% + 매도수수료)</label>` +
        `<div class="rate">매도수수료율<input type="number" inputmode="decimal" step="0.001" min="0" data-cost="feePct" value="${escapeHtml(v(costCfg.feePct))}">% <span>(모든 종목 공통)</span></div></div>` +
        `<div class="my-calc" id="myCalc"></div>` +
        `<div class="my-actions"><span>${rec.source === "json" ? "기본값: 사이트 데이터(ipos.json)" : rec.source === "local" ? "이 기기에 저장됨" : "입력하면 이 기기에 자동 저장"}</span>` +
        `<button type="button" class="my-clear">${rec.source === "local" && jsonMy(item) ? "사이트 값으로 되돌리기" : "내 기록 지우기"}</button></div>` +
        `</div>`;
      el.innerHTML = html;
      renderMyCalcBox(item);
    }
    function renderMyCalcBox(item) {
      const box = document.getElementById("myCalc");
      if (!box) return;
      const c = myCalc(item);
      if (!c.ok) {
        box.innerHTML = `<div class="brk">${c.offer == null ? "공모가와 " : ""}매도 주수·매도가를 넣으면 실제 손익을 계산해요.${isMine(item) ? "" : " (입력하면 ✓ 청약 표시돼요)"}</div>`;
        return;
      }
      const W = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
      box.innerHTML = `<div>내 실제 손익</div><div class="big ${c.profit > 0 ? "gain" : c.profit < 0 ? "loss" : ""}">${escapeHtml(fmtWon(c.profit))}</div>` +
        `<div class="brk">${c.shares.toLocaleString("ko-KR")}주 × (평균 매도가 ${W(c.avg)} − 공모가 ${W(c.offer)}) = ${escapeHtml(fmtWon(c.gross))}<br>` +
        `− 청약수수료 ${c.fee != null ? W(c.fee) : "0원(미입력)"}` +
        (costCfg.on ? `<br>− 증권거래세 ${W(c.tax)} (0.20%) − 매도수수료 ${W(c.sellFee)} (${Number(costCfg.feePct) || 0}%)` : `<br>매도 비용 미반영`) + `</div>`;
    }
    function persistFromSheet() {
      const item = items.find((it) => itemKey(it) === sheetKey);
      if (!item) return;
      const sheet = document.getElementById("sheet");
      const sells = [...sheet.querySelectorAll(".sell-row")].map((row) => ({
        shares: num(row.querySelector('[data-f="shares"]').value),
        price: num(row.querySelector('[data-f="price"]').value),
      }));
      const rec = { sells, fee: num(sheet.querySelector('[data-f="fee"]').value), offer: num(sheet.querySelector('[data-f="offer"]').value) };
      myMap[itemKey(item)] = rec;
      saveMy();
      if (sells.some((x) => x.shares > 0) && !isMine(item)) {
        setMine(itemKey(item), true);
        const t = sheet.querySelector(".sheet-head .sub-toggle");
        if (t) { t.classList.add("on"); t.setAttribute("aria-pressed", "true"); }
      }
      renderMyCalcBox(item);
      renderCalendar();
      renderUpcoming();
      renderMyTotal();
    }
    document.getElementById("sheetBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "sheetBackdrop" || e.target.closest(".sheet-close")) { closeSheet(); return; }
      const yt = e.target.closest("[data-yt-btn]");
      if (yt) {
        const item = items.find((it) => itemKey(it) === sheetKey);
        openYoutubeApp(e, yt.getAttribute("data-yt-btn"), item);
        return;
      }
      const item = items.find((it) => itemKey(it) === sheetKey);
      if (!item) return;
      if (e.target.closest(".row-add")) {
        persistFromSheet();
        myMap[itemKey(item)].sells.push({ shares: null, price: null });
        saveMy(); renderSheet();
        const rows = document.querySelectorAll("#sheet .sell-row");
        const last = rows[rows.length - 1];
        if (last) last.querySelector("input").focus();
        return;
      }
      const del = e.target.closest("[data-del]");
      if (del) {
        persistFromSheet();
        const rec = myMap[itemKey(item)];
        rec.sells.splice(Number(del.getAttribute("data-del")), 1);
        saveMy(); renderSheet(); renderAll();
        return;
      }
      if (e.target.closest(".my-clear")) {
        delete myMap[itemKey(item)];
        saveMy(); renderSheet(); renderAll();
      }
    });
    document.getElementById("sheet").addEventListener("input", (e) => {
      const t = e.target;
      if (t.matches("[data-cost]")) {
        const k = t.getAttribute("data-cost");
        if (k === "on") costCfg.on = t.checked;
        else costCfg.feePct = num(t.value) ?? 0;
        saveCost();
        const item = items.find((it) => itemKey(it) === sheetKey);
        if (item) renderMyCalcBox(item);
        renderCalendar(); renderMyTotal();
        return;
      }
      if (t.matches("[data-f]")) persistFromSheet();
    });
    document.getElementById("sheet").addEventListener("change", (e) => {
      if (e.target.matches('[data-cost="on"]')) e.target.dispatchEvent(new Event("input", { bubbles: true }));
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && sheetKey) closeSheet();
    });
    // 카드 탭 → 상세 패널 (✓ 토글은 캡처 단계에서 먼저 처리되어 여기까지 오지 않음)
    document.getElementById("calendar").addEventListener("click", (e) => {
      const card = e.target.closest(".ipo-card[data-open]");
      if (!card) return;
      openSheet(card.getAttribute("data-open"), card.getAttribute("data-type"));
    });
    document.getElementById("calendar").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (e.target.closest(".sub-toggle")) return;
      const card = e.target.closest(".ipo-card[data-open]");
      if (!card) return;
      e.preventDefault();
      openSheet(card.getAttribute("data-open"), card.getAttribute("data-type"));
    });

    function renderAll() {
      renderCalendar();
      renderUpcoming();
      renderMyTotal();
      if (sheetKey) {
        const t = document.querySelector("#sheet .sheet-head .sub-toggle");
        const item = items.find((it) => itemKey(it) === sheetKey);
        if (t && item) { const on = isMine(item); t.classList.toggle("on", on); t.setAttribute("aria-pressed", String(on)); }
      }
      const f = document.getElementById("mineOnly");
      f.setAttribute("aria-pressed", String(mineOnly));
      const st = document.getElementById("status");
      if (items.length && !st.classList.contains("error")) {
        const n = items.filter(isMine).length;
        st.textContent = mineOnly ? `청약한 종목 ${n}개만 표시 중` : `${items.length}개 종목 표시 중 · 내가 청약 ${n}개`;
      }
    }

    function handleMineToggle(e) {
      const t = e.target.closest && e.target.closest(".sub-toggle[data-mine-id]");
      if (!t) return false;
      e.preventDefault();
      e.stopPropagation();
      const k = t.getAttribute("data-mine-id");
      const item = items.find((it) => itemKey(it) === k);
      setMine(k, !(item ? isMine(item) : t.classList.contains("on")));
      renderAll();
      const again = document.querySelector(`.sub-toggle[data-mine-id="${CSS.escape(k)}"]`);
      if (again && e.type === "keydown") again.focus();
      return true;
    }
    // 캡처 단계에서 처리 → 카드의 유튜브 링크 이동보다 먼저 막음
    document.addEventListener("click", handleMineToggle, true);
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest(".sub-toggle")) handleMineToggle(e);
    }, true);
    document.getElementById("mineOnly").addEventListener("click", () => {
      mineOnly = !mineOnly;
      try { localStorage.setItem(MINE_FILTER_KEY, mineOnly ? "1" : "0"); } catch {}
      renderAll();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      viewMonth -= 1;
      if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      viewMonth += 1;
      if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
      renderCalendar();
    });

    async function loadData() {
      const status = document.getElementById("status");
      try {
        const res = await fetch("./data/ipos.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        items = (Array.isArray(data.items) ? data.items : []).filter((it) => {
          const n = String(it.name || "");
          const id = String(it.id || "");
          return !n.includes("실권") && !id.includes("rights");
        });
        document.getElementById("updatedAt").textContent = formatUpdatedAt(data.updatedAt || "");
        // Default view: current month (today, KST on user's device)
        const nowD = new Date();
        viewYear = nowD.getFullYear();
        viewMonth = nowD.getMonth();
        status.classList.remove("error");
        renderAll();
      } catch (err) {
        document.getElementById("updatedAt").textContent = "데이터를 불러오지 못했습니다";
        status.textContent = "ipos.json을 불러올 수 없습니다. HTTP 서버로 열어 주세요.";
        status.classList.add("error");
        console.error(err);
        renderAll();
      }
    }


    document.addEventListener("click", (e) => {
      const a = e.target.closest("a.ipo-card[data-yt], .upcoming-item a[data-yt]");
      if (!a) return;
      const url = a.getAttribute("data-yt");
      if (!url) return;
      const idAttr = a.getAttribute("data-id");
      const item = (items || []).find((it) => it.id === idAttr) || (items || []).find((it) => (it.videoUrl || "") === url);
      openYoutubeApp(e, url, item);
    });

    loadData();
  </script>
</body>
</html>
