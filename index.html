<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공모주 달력</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1a2332;
      --muted: #6b7a8d;
      --border: #e2e8f0;
      --subscribe: #dbeafe;
      --subscribe-border: #60a5fa;
      --subscribe-text: #1e3a8a;
      --subscribe-strong: #2563eb;
      --listing: #dcfce7;
      --listing-border: #4ade80;
      --listing-text: #14532d;
      --listing-strong: #16a34a;
      --mine: #f59e0b;
      --today: #eff6ff;
      --today-ring: #3b82f6;
      --shadow: 0 1px 3px rgba(26, 35, 50, 0.06);
      --radius: 12px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.45rem;
      box-shadow: var(--shadow);
    }

    .toolbar button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.05rem;
      display: grid;
      place-items: center;
      transition: background 0.15s ease;
    }

    .toolbar button:hover { background: var(--bg); }
    .toolbar button:focus-visible {
      outline: 2px solid var(--today-ring);
      outline-offset: 1px;
    }

    .month-label {
      min-width: 8.5rem;
      text-align: center;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .dot.subscribe { background: var(--subscribe); border-color: var(--subscribe-border); }
    .dot.listing { background: var(--listing); border-color: var(--listing-border); }

    .layout {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 900px) {
      .layout { grid-template-columns: 1fr 280px; align-items: start; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      max-width: 100%;
    }

    #calendarPanel {
      width: 100%;
      min-width: 0;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    .weekdays div { padding: 0.55rem 0.15rem; min-width: 0; }
    .calendar {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
    }

    .day {
      min-width: 0;
      min-height: 7.2rem;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.3rem 0.2rem 0.35rem;
      background: var(--surface);
      vertical-align: top;
      overflow: hidden;
    }

    .day:nth-child(5n) { border-right: none; }
    .day.outside { background: #fafbfc; color: #a0aec0; }
    .day.today { background: var(--today); box-shadow: inset 0 0 0 1.5px var(--today-ring); }

    .day-num {
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      padding: 0 0.15rem;
    }

    .day.outside .day-num { color: #a0aec0; }

    .cards { display: flex; flex-direction: column; gap: 0.25rem; }

    .ipo-card {
      border-radius: 7px;
      border: 1px solid transparent;
      padding: 0.28rem 0.3rem;
      font-size: 0.68rem;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: anywhere;
      max-width: 100%;
      min-width: 0;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: default;
    }

    a.ipo-card {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a.ipo-card:hover {
      filter: brightness(0.97);
    }

    a.ipo-card:active {
      transform: scale(0.98);
    }

    .ipo-card.subscribe {
      background: var(--subscribe);
      border-color: var(--subscribe-border);
      color: var(--subscribe-text);
    }

    .ipo-card.listing {
      background: var(--listing);
      border-color: var(--listing-border);
      color: var(--listing-text);
    }

    .ipo-card .name {
      font-weight: 700;
      font-size: 0.7rem;
      margin-bottom: 0.08rem;
    }

    .ipo-card .meta-line {
      opacity: 0.92;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .ipo-card .result-line {
      margin-top: 0.12rem;
      padding-top: 0.1rem;
      border-top: 1px dashed currentColor;
      font-weight: 700;
      font-size: 0.62rem;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    .ipo-card .result-line.gain { color: #dc2626; }
    .ipo-card .result-line.loss { color: #2563eb; }
    .ipo-card .result-line.pending, .ipo-card .result-line.flat { opacity: 0.75; font-weight: 600; }

    .side { padding: 1rem; }
    .side h2 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .upcoming-section { margin-bottom: 1.1rem; }
    .upcoming-section:last-child { margin-bottom: 0; }

    .upcoming-label {
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .upcoming-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }

    .upcoming-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      font-size: 0.8rem;
      background: #fbfcfe;
    }

    .upcoming-item .u-name { font-weight: 700; margin-bottom: 0.15rem; }
    .upcoming-item .u-detail { color: var(--muted); font-size: 0.74rem; }
    .upcoming-item.empty { color: var(--muted); border-style: dashed; }

    .status {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error { color: #b91c1c; }

    /* 내가 청약한 종목 */
    .ipo-card { position: relative; }
    .ipo-card .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.15rem;
    }
    .ipo-card .name-row .name { min-width: 0; }
    .sub-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.05rem;
      height: 1.05rem;
      padding: 0 0.15rem;
      border-radius: 999px;
      border: 1.5px solid currentColor;
      background: rgba(255,255,255,0.75);
      color: inherit;
      opacity: 0.45;
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .sub-toggle { position: relative; }
    .sub-toggle::after { content: ""; position: absolute; inset: -6px; } /* 모바일 탭 영역 확대 */
    .sub-toggle:hover { opacity: 0.8; }
    .sub-toggle:focus-visible { outline: 2px solid var(--today-ring); outline-offset: 1px; }
    .sub-toggle .lbl { display: none; }
    .sub-toggle.on {
      opacity: 1;
      background: #f59e0b;
      border-color: #d97706;
      color: #fff;
    }
    .sub-toggle.on .lbl { display: inline; margin-left: 0.08rem; }
    .ipo-card.mine {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1.5px #f59e0b;
      background-image: linear-gradient(rgba(254, 243, 199, 0.55), rgba(254, 243, 199, 0.55));
    }
    .upcoming-item { position: relative; }
    .upcoming-item .u-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; }
    .upcoming-item .sub-toggle { min-width: 1.35rem; height: 1.35rem; font-size: 0.72rem; color: var(--muted); }
    .upcoming-item .sub-toggle.on { color: #fff; }
    .upcoming-item.mine { border-color: #f59e0b; box-shadow: 0 0 0 1.5px #f59e0b; background: #fffbeb; }
    .filter-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-left: auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .filter-toggle[aria-pressed="true"] { background: #f59e0b; border-color: #d97706; color: #fff; font-weight: 700; }
    .dot.mine { background: #fff; border-color: #f59e0b; border-width: 2px; }
    .dot.subscribe { border-left: 3px solid var(--subscribe-strong); }
    .dot.listing { border-left: 3px solid var(--listing-strong); }

    @media (max-width: 640px) {
      .sub-toggle { min-width: 0.85rem; height: 0.85rem; font-size: 0.5rem; padding: 0 0.1rem; border-width: 1px; }
      .sub-toggle .lbl { font-size: 0.48rem; }
      .legend { align-items: center; }
      .filter-toggle { font-size: 0.74rem; padding: 0.28rem 0.6rem; }
    }

    @media (max-width: 640px) {
      .wrap { padding: 0.75rem 0.4rem 2rem; }
      h1 { font-size: 1.25rem; }
      .day { min-height: 5.2rem; padding: 0.2rem 0.1rem 0.25rem; }
      .day-num { font-size: 0.7rem; padding: 0 0.1rem; }
      .ipo-card { font-size: 0.56rem; padding: 0.18rem 0.18rem; }
      .ipo-card .name { font-size: 0.58rem; }
      .ipo-card .meta-line { font-size: 0.52rem; line-height: 1.3; }
      .ipo-card .result-line { font-size: 0.5rem; line-height: 1.3; }
      .weekdays { font-size: 0.65rem; }
      .weekdays div { padding: 0.45rem 0.05rem; }
      .month-label { min-width: 6.5rem; font-size: 0.92rem; }
      .cards { gap: 0.18rem; }
    }

    /* ---- 카드 종류 구분 (청약=파랑, 상장=초록) ---- */
    .ipo-card.subscribe { border-left: 3px solid var(--subscribe-strong); }
    .ipo-card.listing { border-left: 3px solid var(--listing-strong); }
    .type-badge {
      display: inline-block;
      flex: none;
      padding: 0 0.22rem;
      margin-right: 0.15rem;
      border-radius: 4px;
      font-size: 0.56rem;
      font-weight: 800;
      line-height: 1.35;
      color: #fff;
      vertical-align: 1px;
      letter-spacing: -0.02em;
    }
    .type-badge.subscribe { background: var(--subscribe-strong); }
    .type-badge.listing { background: var(--listing-strong); }
    .type-badge .b-short { display: none; }
    .ipo-card.mine {
      border-color: var(--mine);
      border-left-width: 3px;
      box-shadow: 0 0 0 2px var(--mine);
      background-image: none;
    }
    .ipo-card.subscribe.mine { border-left-color: var(--subscribe-strong); background: #dbeafe; }
    .ipo-card.listing.mine { border-left-color: var(--listing-strong); background: #dcfce7; }
    .ipo-card .sub-toggle.on .lbl { display: none; }
    .ipo-card { cursor: pointer; }
    .ipo-card:focus-visible { outline: 2px solid var(--today-ring); outline-offset: 1px; }
    .ipo-card .my-line {
      margin-top: 0.1rem;
      padding: 0.05rem 0.2rem;
      border-radius: 4px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      font-weight: 800;
      font-size: 0.62rem;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .ipo-card .my-line.gain b { color: #dc2626; }
    .ipo-card .my-line.loss b { color: #2563eb; }
    .legend .badge-sample { display: inline-flex; align-items: center; gap: 0.25rem; }
    .my-total {
      display: inline-flex; align-items: center; gap: 0.3rem;
      border: 1px solid #fdba74; background: #fff7ed; color: #9a3412;
      border-radius: 999px; padding: 0.25rem 0.65rem; font-size: 0.8rem; font-weight: 700;
    }
    .my-total b.gain { color: #dc2626; }
    .my-total b.loss { color: #2563eb; }
    .my-total[hidden] { display: none; }

    /* ---- 상세 패널 ---- */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .sheet-backdrop[hidden] { display: none; }
    .sheet {
      background: var(--surface); color: var(--text);
      width: min(520px, 100%); max-height: calc(100vh - 2rem); overflow: auto;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(15,23,42,0.25);
      padding: 1rem 1rem 1.2rem; font-size: 0.86rem;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-head { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
    .sheet-head h3 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 0; letter-spacing: -0.02em; }
    .sheet-head .type-badge { font-size: 0.72rem; padding: 0.05rem 0.35rem; }
    .sheet-close {
      appearance: none; border: none; background: #f1f5f9; border-radius: 999px;
      width: 2rem; height: 2rem; font-size: 1.1rem; cursor: pointer; flex: none; color: var(--text);
    }
    .sheet .sub-toggle { min-width: 2rem; height: 2rem; font-size: 0.85rem; color: var(--muted); opacity: 0.7; }
    .sheet .sub-toggle.on { color: #fff; opacity: 1; }
    .sheet .sub-toggle .lbl { display: none; }
    .sheet .sub-toggle.on .lbl { display: inline; margin-left: 0.15rem; }
    .sheet-sec { border-top: 1px solid var(--border); padding-top: 0.7rem; margin-top: 0.7rem; }
    .sheet-sec h4 { font-size: 0.86rem; font-weight: 800; margin-bottom: 0.4rem; }
    .sheet .kv { color: var(--muted); font-size: 0.8rem; }
    .sheet .kv b { color: var(--text); font-weight: 650; }
    .sheet ul.lines { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.82rem; }
    .sheet .src { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; }
    .sheet .src a { color: var(--muted); }
    .sheet .yt-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      margin-top: 0.6rem; padding: 0.55rem; border-radius: 10px;
      background: #ef4444; color: #fff; font-weight: 750; text-decoration: none; font-size: 0.86rem;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem 0.6rem; }
    .form-grid label, .sell-row label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.74rem; color: var(--muted); }
    .sheet input[type="number"], .sheet input[type="text"] {
      font: inherit; font-size: 16px; /* iOS 확대 방지 */
      padding: 0.4rem 0.5rem; border: 1px solid var(--border); border-radius: 8px; width: 100%;
      color: var(--text); background: #fff;
    }
    .sell-rows { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.5rem 0 0.35rem; }
    .sell-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 0.45rem; align-items: end; }
    .row-del, .row-add, .my-clear {
      appearance: none; font: inherit; font-size: 0.8rem; cursor: pointer;
      border: 1px solid var(--border); background: #f8fafc; border-radius: 8px; padding: 0.42rem 0.6rem; color: var(--text);
    }
    .row-del { padding: 0.42rem 0.55rem; }
    .cost-box { margin-top: 0.55rem; padding: 0.5rem 0.6rem; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; font-size: 0.78rem; }
    .cost-box .chk { display: flex; align-items: center; gap: 0.35rem; font-weight: 650; color: var(--text); }
    .cost-box .rate { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; color: var(--muted); }
    .cost-box .rate input { width: 6.5rem; }
    .my-calc { margin-top: 0.6rem; padding: 0.6rem; border-radius: 10px; background: #fff7ed; border: 1px solid #fdba74; }
    .my-calc .big { font-size: 1.15rem; font-weight: 850; }
    .my-calc .big.gain { color: #dc2626; }
    .my-calc .big.loss { color: #2563eb; }
    .my-calc .brk { font-size: 0.75rem; color: #7c2d12; margin-top: 0.2rem; line-height: 1.5; }
    .my-actions { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.72rem; color: var(--muted); }
    @media (max-width: 640px) {
      .sheet-backdrop { align-items: flex-end; padding: 0; }
      .sheet { width: 100%; max-height: 88vh; border-radius: 16px 16px 0 0; padding: 0.9rem 0.9rem calc(1.1rem + env(safe-area-inset-bottom)); }
      .type-badge { font-size: 0.46rem; padding: 0 0.12rem; margin-right: 0.08rem; border-radius: 3px; }
      .type-badge .b-long { display: none; }
      .type-badge .b-short { display: inline; }
      .sheet .type-badge .b-long { display: inline; }
      .sheet .type-badge .b-short { display: none; }
      .ipo-card.subscribe, .ipo-card.listing { border-left-width: 2.5px; }
      .ipo-card.mine { box-shadow: 0 0 0 1.5px var(--mine); }
      .ipo-card .my-line { font-size: 0.5rem; padding: 0.03rem 0.1rem; }
      .my-total { font-size: 0.72rem; padding: 0.22rem 0.55rem; }
    }

    /* ---- 도구 버튼 줄 ---- */
    .actions { display: flex; gap: 0.4rem; margin: -0.35rem 0 0.8rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .act-btn {
      appearance: none; flex: none; font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 0.38rem 0.75rem; box-shadow: var(--shadow); white-space: nowrap;
    }
    .act-btn:active { transform: scale(0.98); }
    /* ---- 청약 추천 배지 ---- */
    .rec-badge { display: inline-block; padding: 0 0.25rem; border-radius: 4px; font-size: 0.58rem; font-weight: 800; line-height: 1.4; vertical-align: 1px; white-space: nowrap; }
    .rec-badge.buy { background: #dc2626; color: #fff; }
    .rec-badge.small { background: #f59e0b; color: #fff; }
    .rec-badge.hold { background: #64748b; color: #fff; }
    .rec-badge.tbd { background: #e2e8f0; color: #475569; }
    .noacct { display: inline-block; padding: 0 0.2rem; border-radius: 4px; font-size: 0.55rem; font-weight: 700; line-height: 1.4; border: 1px dashed #94a3b8; color: #475569; background: #fff; white-space: nowrap; }
    .ipo-card .rec-line { margin-top: 0.08rem; display: flex; flex-wrap: wrap; gap: 0.12rem; }
    /* ---- 날짜별 묶인 돈 / 환불 ---- */
    .day-money { font-size: 0.6rem; font-weight: 750; line-height: 1.3; margin: -0.1rem 0 0.2rem; padding: 0 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-money.tied { color: #b45309; }
    .day-money.refund { color: #0f766e; }
    /* ---- 패널: 추천/묶인 돈 ---- */
    .rec-head { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
    .rec-head .rec-badge { font-size: 0.8rem; padding: 0.08rem 0.45rem; border-radius: 6px; }
    .rec-head .noacct { font-size: 0.72rem; padding: 0.05rem 0.35rem; }
    table.rec-tbl { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    table.rec-tbl td { padding: 0.22rem 0.15rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    table.rec-tbl td.pt { text-align: right; font-weight: 800; white-space: nowrap; }
    table.rec-tbl td.pt.plus { color: #dc2626; } table.rec-tbl td.pt.minus { color: #2563eb; }
    .rule { margin-top: 0.4rem; font-size: 0.72rem; color: var(--muted); line-height: 1.5; background: #f8fafc; border-radius: 8px; padding: 0.4rem 0.5rem; }

    .money-box { padding: 0.5rem 0.6rem; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 10px; font-size: 0.8rem; line-height: 1.55; }
    .money-box .hint { color: #92400e; font-size: 0.76rem; margin-top: 0.25rem; }
    .money-box label { display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.74rem; color: var(--muted); margin-top: 0.4rem; }
    /* ---- 수익 요약 / 붙여넣기 / 캘린더 ---- */

    .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-bottom: 0.5rem; }
    .month-nav button { appearance: none; border: 1px solid var(--border); background: #fff; border-radius: 999px; width: 2rem; height: 2rem; cursor: pointer; font-size: 1rem; }
    .sheet textarea { font: inherit; font-size: 16px; width: 100%; min-height: 7.5rem; padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px; resize: vertical; }
    .btn-row { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
    .btn-primary, .btn-sub { appearance: none; font: inherit; font-size: 0.86rem; font-weight: 750; border-radius: 10px; padding: 0.55rem 0.8rem; cursor: pointer; flex: 1; text-align: center; text-decoration: none; }
    .btn-primary { background: #2563eb; color: #fff; border: 1px solid #1d4ed8; }
    .btn-primary[disabled] { opacity: 0.45; cursor: default; }
    .btn-sub { background: #f8fafc; color: var(--text); border: 1px solid var(--border); }
    .pv-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.6rem; }
    .pv-item { border: 1px solid var(--border); border-radius: 8px; padding: 0.45rem 0.55rem; font-size: 0.8rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .pv-item.ok { border-color: #86efac; background: #f0fdf4; }
    .pv-item.skip { opacity: 0.7; background: #f8fafc; }
    .pv-item .st { flex: none; font-size: 0.7rem; font-weight: 800; padding: 0.05rem 0.35rem; border-radius: 4px; background: #e2e8f0; color: #334155; }
    .pv-item.ok .st { background: #16a34a; color: #fff; }
    .pv-item select { font: inherit; font-size: 16px; margin-top: 0.25rem; max-width: 100%; }
    .note-s { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.5; }
    .cal-url { font-size: 0.72rem; word-break: break-all; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.45rem; margin-top: 0.4rem; user-select: all; }
    @media (max-width: 640px) {
      .actions { margin: -0.4rem 0 0.6rem; }

    header.top { align-items: center; margin-bottom: 0.45rem; gap: 0.4rem 0.75rem; flex-wrap: nowrap; }

    .bar .actions { margin: 0 0 0 auto; padding: 0; gap: 0.3rem; flex: none; overflow: visible; display: flex; align-items: center; }
    .act-btn { font-size: 0.75rem; padding: 0.24rem 0.55rem; display: inline-flex; align-items: center; gap: 0.2rem; line-height: 1.3; box-shadow: none; }
    .act-btn.filter-toggle { margin: 0; font-weight: 700; }
    .legend-d { position: relative; }
    .legend-d summary { list-style: none; }

    .legend-d .legend { position: absolute; right: 0; top: calc(100% + 0.3rem); z-index: 20; width: min(18rem, 86vw); flex-direction: column; gap: 0.35rem; margin: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,0.15); padding: 0.6rem 0.7rem; font-size: 0.78rem; color: var(--text); }

<body>
  <div class="wrap">
    <header class="top">
      <div class="title">
        <h1>공모주 달력</h1>
        <p class="meta" id="updatedAt">데이터 불러오는 중…</p>
      </div>
      <div class="toolbar" role="group" aria-label="월 이동">
        <button type="button" id="prevMonth" aria-label="이전 달">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button type="button" id="nextMonth" aria-label="다음 달">›</button>
      </div>
    </header>

    <div class="bar">
      <span class="my-total" id="myTotal" hidden></span>
      <div class="actions" role="toolbar" aria-label="도구">
        <button type="button" class="act-btn" data-tool="summary" title="수익 요약">📊<span class="t">요약</span></button>
        <button type="button" class="act-btn" data-tool="paste" title="체결 문자 붙여넣기">📋<span class="t">문자</span></button>
        <button type="button" class="act-btn" data-tool="cal" title="내 캘린더에 추가">📅<span class="t">캘린더</span></button>
        <button type="button" class="act-btn filter-toggle" id="mineOnly" aria-pressed="false" title="청약한 종목만 보기">✓<span class="t">청약만</span></button>
        <details class="legend-d">
          <summary class="act-btn" title="범례">ⓘ</summary>
          <div class="legend">
            <span class="badge-sample"><span class="type-badge subscribe">청</span> 청약 마감일 (파랑)</span>
            <span class="badge-sample"><span class="type-badge listing">상</span> 상장일 (초록)</span>
            <span><i class="dot mine"></i> 주황 테두리 = 내가 청약 (✓ 눌러 표시)</span>
            <span><span class="rec-badge buy">추천</span><span class="rec-badge small">소액</span><span class="rec-badge hold">보류</span> 청약 판단 (투자 권유 아님)</span>
            <span>🔒 묶인 증거금 · ↩ 환불 (✓ 종목 합계)</span>
            <span>카드 탭 → 상세 · 예상 손익 · 내 매도 입력</span>
          </div>
        </details>
      </div>
    </div>

    <div class="layout">
      <div class="panel" id="calendarPanel">
        <div class="weekdays">
          <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
        </div>
        <div class="calendar" id="calendar"></div>
      </div>

      <aside class="panel side">
        <h2>다가오는 일정</h2>
        <div class="upcoming-section">
          <div class="upcoming-label"><i class="dot subscribe"></i> 청약</div>
          <ul class="upcoming-list" id="upcomingSubscribe"></ul>
        </div>
        <div class="upcoming-section">
          <div class="upcoming-label"><i class="dot listing"></i> 상장</div>
          <ul class="upcoming-list" id="upcomingListing"></ul>
        </div>
      </aside>
    </div>

    <p class="status" id="status"></p>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>

  <script>
    const WEEKDAYS_KO = ["일", "월", "화", "수", "목", "금", "토"];

    let items = [];
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth(); // default: current month

    // ---- 내가 청약한 종목 (localStorage, 기기·브라우저별) ----
    const MINE_KEY = "ipoCalendar.mine.v1";
    const MINE_FILTER_KEY = "ipoCalendar.mineOnly.v1";
    function loadMine() {
      try { return JSON.parse(localStorage.getItem(MINE_KEY) || "{}") || {}; } catch { return {}; }
    }
    let mineMap = loadMine();
    let mineOnly = false;
    try { mineOnly = localStorage.getItem(MINE_FILTER_KEY) === "1"; } catch {}
    function itemKey(item) { return String((item && (item.id || item.name)) || ""); }
    function isMine(item) {
      const k = itemKey(item);
      if (Object.prototype.hasOwnProperty.call(mineMap, k)) return mineMap[k] === true; // 명시적 설정(해제 포함) 우선
      return item.subscribed === true;
    }
    function setMine(k, on) {
      mineMap[k] = !!on;
      try { localStorage.setItem(MINE_KEY, JSON.stringify(mineMap)); } catch {}
    }
    function toggleHtml(item) {
      const on = isMine(item);
      return `<span class="sub-toggle${on ? " on" : ""}" role="button" tabindex="0" data-mine-id="${escapeHtml(itemKey(item))}" aria-pressed="${on}" aria-label="${escapeHtml(item.name)} 청약함 표시" title="${on ? "청약함 (눌러서 해제)" : "청약했으면 눌러서 표시"}">✓<span class="lbl">청약</span></span>`;
    }

    function pad2(n) { return String(n).padStart(2, "0"); }

    function toDateKey(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function parseYMD(s) {
      if (!s) return new Date(NaN);
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatYMDKo(s) {
      const d = parseYMD(s);
      return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS_KO[d.getDay()]})`;
    }

    function formatUpdatedAt(iso) {
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const y = d.getFullYear();
        const m = pad2(d.getMonth() + 1);
        const day = pad2(d.getDate());
        const h = pad2(d.getHours());
        const mi = pad2(d.getMinutes());
        return `데이터 갱신: ${y}-${m}-${day} ${h}:${mi}`;
      } catch {
        return `데이터 갱신: ${iso}`;
      }
    }

    function displayScore(score) {
      if (score === null || score === undefined || score === "" || score === "없음") return "없음";
      return String(score);
    }

    function displayDeposit(dep) {
      if (dep === null || dep === undefined || dep === "" || dep === "미확인") return "미확인";
      return String(dep);
    }

    function abbreviateBroker(name) {
      const s = String(name || "").trim();
      if (!s) return "";
      const map = [
        [/미래에셋/, "미래"],
        [/유진투자|유진/, "유진"],
        [/대신/, "대신"],
        [/키움/, "키움"],
        [/한국투자|한투/, "한투"],
        [/NH투자|^NH$|나무/, "NH"],
        [/^KB|KB증권/, "KB"],
        [/신한/, "신한"],
        [/삼성/, "삼성"],
        [/유안타/, "유안타"],
        [/상상인/, "상상인"],
        [/IBK/, "IBK"],
        [/하나/, "하나"],
        [/한양/, "한양"],
      ];
      for (const [re, short] of map) {
        if (re.test(s)) return short;
      }
      return s.replace(/증권|투자증권/g, "").trim() || s;
    }

    function displayBrokers(item) {
      const raw = item.brokers;
      if (!raw || (Array.isArray(raw) && raw.length === 0)) return "";
      const list = Array.isArray(raw) ? raw : String(raw).split(/[,·\/]/);
      const shorts = [...new Set(list.map((x) => abbreviateBroker(x)).filter(Boolean))];
      return shorts.join("·");
    }

    function eachDateInclusive(startStr, endStr) {
      const out = [];
      let cur = parseYMD(startStr);
      const end = parseYMD(endStr);
      while (cur <= end) {
        out.push(toDateKey(cur));
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      }
      return out;
    }

    function eventsForDate(dateKey) {
      const events = [];
      for (const item of items) {
        if (mineOnly && !isMine(item)) continue;
        // 청약은 기간의 마지막 날만 표시
        if (item.subscribeEnd === dateKey) {
          events.push({ type: "subscribe", item });
        }
        if (item.listDate === dateKey) {
          events.push({ type: "listing", item });
        }
      }
      return events;
    }

    function extractYoutubeId(url) {
      if (!url) return "";
      const s = String(url).trim();
      let m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/youtube\.com\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      m = s.match(/^([A-Za-z0-9_-]{11})$/);
      return m ? m[1] : "";
    }

    function extractStartSeconds(url, item) {
      if (item && item.videoStartSeconds != null && item.videoStartSeconds !== "") {
        const n = Number(item.videoStartSeconds);
        if (!Number.isNaN(n) && n >= 0) return Math.floor(n);
      }
      if (!url) return 0;
      const s = String(url);
      let m = s.match(/[?&]t=(\d+)s?/i);
      if (m) return parseInt(m[1], 10);
      m = s.match(/[?&]start=(\d+)/i);
      if (m) return parseInt(m[1], 10);
      m = s.match(/[?&]t=(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if (m && (m[1] || m[2] || m[3])) {
        return (parseInt(m[1] || "0", 10) * 3600) + (parseInt(m[2] || "0", 10) * 60) + parseInt(m[3] || "0", 10);
      }
      return 0;
    }

    function youtubeWebUrl(id, startSec) {
      if (startSec && startSec > 0) return `https://youtu.be/${id}?t=${startSec}`;
      return `https://youtu.be/${id}`;
    }

    function youtubeAppHref(url, item) {
      const id = extractYoutubeId(url);
      if (!id) return url || "#";
      const startSec = extractStartSeconds(url, item);
      return youtubeWebUrl(id, startSec);
    }

    function openYoutubeApp(event, url, item) {
      const id = extractYoutubeId(url);
      if (!id) return;
      event.preventDefault();
      const ua = navigator.userAgent || "";
      const startSec = extractStartSeconds(url, item);
      // youtu.be?t= 초 단위가 앱·웹 모두에서 시점을 가장 잘 지킴
      const stamped = youtubeWebUrl(id, startSec);
      if (/Android/i.test(ua)) {
        const tQuery = startSec > 0 ? `&t=${startSec}` : "";
        window.location.href =
          `intent://www.youtube.com/watch?v=${id}${tQuery}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${encodeURIComponent(stamped)};end`;
        return;

    function fmtWon(n) {

    function fmtPct(p) {

    function fmtShares(n) {
      return Number.isInteger(n) ? `${n}주` : `${n}주`;

    // 상장 결과: 시초가 수익률 · 최소청약 기준 균등 배정 · 수수료 차감 손익
    function resultInfo(item) {
      const r = item.result;
      const todayKey = toDateKey(new Date());
      if (!r) {
        if (item.listDate && item.listDate <= todayKey) {
          return { short: "결과 확인중", detail: "상장 결과 확인중", cls: "pending" };

      } else {
        parts.push("시초 확인중");

      if (r.allottedShares != null) {
        parts.push(`${fmtShares(r.allottedShares)}${r.lottery ? "(추첨)" : ""}`);

      } else {
        parts.push("배정 확인중");
      }
      if (r.fee != null) {
        let f = `청약수수료 ${r.feeBroker || ""} ${Number(r.fee).toLocaleString("ko-KR")}원`;
        f += r.feeWaivedIfNotAllotted ? " (미배정 시 면제" : " (청약 건당";
        if (r.feeExpected != null && r.feeExpected !== r.fee) f += `, 기대 ${Number(r.feeExpected).toLocaleString("ko-KR")}원`;
        det.push(f + ")");
      } else {
        det.push(`청약수수료 ${r.feeBroker || ""} 확인중 (손익은 수수료 차감 전)`);
      }
      let cls = "pending";
      if (r.profitWon != null) {
        parts.push(fmtWon(r.profitWon) + (r.profitIncludesFee ? "" : "(수수료 확인중)"));
        det.push(`예상 손익(시초가 매도): ${fmtWon(r.profitWon)}${r.profitIncludesFee ? " · 수수료 차감" : " · 수수료 미차감"}${r.lottery ? " · 추첨 포함 기대값" : ""}`);
        cls = r.profitWon > 0 ? "gain" : r.profitWon < 0 ? "loss" : "flat";
      } else {
        parts.push("손익 확인중");
      }
      return { short: parts.join(" · "), detail: det.join("\n"), cls };
    }

    function fmtWonShort(n) {
      const sign = n > 0 ? "+" : n < 0 ? "−" : "";
      const a = Math.abs(Math.round(n));
      if (a >= 10000) return sign + (Math.round(a / 1000) / 10).toLocaleString("ko-KR") + "만";
      return sign + a.toLocaleString("ko-KR");

    function cardHtml(type, item) {

        `<div class="l2"><span class="info">${info}</span>${toggleHtml(item)}</div>` +
        (type === "subscribe" ? `<div class="l3">${escapeHtml((recInfo(item).brokers || []).join("·") || "증권사 확인중")} · ${escapeHtml(displayDeposit(item.minDeposit))}</div>` : "") +

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")

    function isWeekday(d) {
      const dow = d.getDay();
      return dow >= 1 && dow <= 5;
    }

    function renderCalendar() {
      const label = document.getElementById("monthLabel");
      label.textContent = `${viewYear}년 ${viewMonth + 1}월`;

      const first = new Date(viewYear, viewMonth, 1);
      // Monday of the week that contains the 1st
      const dow = first.getDay();
      const toMon = dow === 0 ? -6 : 1 - dow;
      let cursor = new Date(viewYear, viewMonth, 1 + toMon);

      const last = new Date(viewYear, viewMonth + 1, 0);
      let end = new Date(last);
      const endDow = end.getDay();
      if (endDow === 0) end.setDate(end.getDate() - 2);
      else if (endDow === 6) end.setDate(end.getDate() - 1);
      else end.setDate(end.getDate() + (5 - endDow));

      const todayKey = toDateKey(new Date());
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";
      const money = moneyByDate();

      while (cursor <= end) {
        if (isWeekday(cursor)) {
          const d = new Date(cursor);
          const key = toDateKey(d);
          const outside = d.getMonth() !== viewMonth;
          const cell = document.createElement("div");
          cell.className = "day";
          if (outside) cell.classList.add("outside");
          if (key === todayKey) cell.classList.add("today");

          const events = eventsForDate(key);
          const tied = money.tied[key], rf = money.refund[key];
          const man = (n) => fmtMan(n).replace(/원$/, "");
          if (!events.length) cell.classList.add("empty");
          cell.innerHTML =
            `<div class="day-head"><span class="day-num">${d.getDate()}</span>` +
            (tied ? `<span class="day-money tied" title="묶인 돈 ${escapeHtml(fmtMan(tied.sum))} · ${escapeHtml(tied.items.map((x) => x.name).join(", "))}">🔒${escapeHtml(man(tied.sum))}</span>` : "") +
            (rf ? `<span class="day-money refund" title="환불 ${escapeHtml(fmtMan(rf.sum))} · ${escapeHtml(rf.items.map((x) => x.name).join(", "))}">↩${escapeHtml(man(rf.sum))}</span>` : "") +
            `</div>` +
            `<div class="cards">${events.map((e) => cardHtml(e.type, e.item)).join("")}</div>`;
          cal.appendChild(cell);
        }
        cursor.setDate(cursor.getDate() + 1);
      }
    }

    function renderUpcoming() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const subs = [];
      const lists = [];

      for (const item of items) {
        if (mineOnly && !isMine(item)) continue;

              `<div class="rec-line" style="margin-top:0.2rem;display:flex;gap:0.2rem">${recBadgeHtml(item, false)}</div>` +

      listEl.innerHTML = lists.length
        ? lists.slice(0, 8).map(({ item }) => {
            return (
              `<li class="upcoming-item${isMine(item) ? " mine" : ""}">${item.videoUrl ? `<a href="${escapeHtml(youtubeAppHref(item.videoUrl, item))}" data-yt="${escapeHtml(item.videoUrl)}" data-id="${escapeHtml(item.id || "")}" style="color:inherit;text-decoration:none;display:block">` : ""}` +
              `<div class="u-head"><div class="u-name">${escapeHtml(item.name)}</div>${toggleHtml(item)}</div>` +
              `<div class="u-detail">${formatYMDKo(item.listDate)} · ${escapeHtml(displayDeposit(item.minDeposit))} · ${escapeHtml(displayScore(item.score))}${displayBrokers(item) ? " · " + escapeHtml(displayBrokers(item)) : ""}</div>` +
              `${item.videoUrl ? `</a>` : ""}</li>`
            );
          }).join("")
        : `<li class="upcoming-item empty">예정된 상장 없음</li>`;
    }


    // ---- 내 매도 기록 (localStorage + ipos.json의 my 기본값) ----
    const MY_KEY = "ipoCalendar.my.v1";
    const COST_KEY = "ipoCalendar.sellCost.v1";
    // 2026.1.1 이후 양도분: 코스닥 0.20%, 코스피 0.05%+농특세 0.15% = 0.20% (증권거래세법 시행령 제5조)
    const SELL_TAX_RATE = 0.002;
    const DEFAULT_SELL_FEE_PCT = 0.015; // 매도 수수료율(%) 기본값, 사용자 수정 가능
    // 온라인 청약수수료 기본값(일반 등급, 원) — 배정 시 기준
    const BROKER_SUB_FEE = { 한투: 2000, 미래: 2000, KB: 1500, 신한: 2000, 삼성: 2000, 대신: 2000, NH: 2000, 유진: 2000, 하나: 2000, 한화: 2000, SK: 2000 };
    function loadJSON(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch { return d; } }
    let myMap = loadJSON(MY_KEY, {});
    let costCfg = Object.assign({ on: true, feePct: DEFAULT_SELL_FEE_PCT }, loadJSON(COST_KEY, {}));
    function saveMy() { try { localStorage.setItem(MY_KEY, JSON.stringify(myMap)); } catch {} }
    function saveCost() { try { localStorage.setItem(COST_KEY, JSON.stringify(costCfg)); } catch {} }
    function num(v) { if (v === "" || v == null) return null; const n = Number(String(v).replace(/[,\s원주]/g, "")); return Number.isFinite(n) ? n : null; }
    function jsonMy(item) {
      const m = item.my;
      if (!m || typeof m !== "object") return null;
      let sells = Array.isArray(m.sells) ? m.sells.map((x) => ({ shares: num(x.shares), price: num(x.price ?? x.sellPrice), orderNo: x.orderNo != null ? String(x.orderNo) : null, fillKey: x.fillKey || (x.orderNo != null ? String(x.orderNo) : null), time: x.time || null })) : [];
      if (!sells.length && (m.shares != null || m.sellPrice != null)) sells = [{ shares: num(m.shares), price: num(m.sellPrice) }];
      return { sells, fee: num(m.fee), offer: num(m.offerPrice), deposit: num(m.deposit) };
    }
    function defaultSubFee(item) {
      if (item.result && item.result.fee != null) return item.result.fee;
      const b = (Array.isArray(item.brokers) ? item.brokers : []).map(abbreviateBroker);
      const mine = b.find((x) => BROKER_SUB_FEE[x] != null);
      return mine ? BROKER_SUB_FEE[mine] : null;
    }
    function myRecord(item) {
      const k = itemKey(item);
      const local = myMap[k];
      const fromJson = jsonMy(item);
      const base = local || fromJson || { sells: [], fee: null, offer: null };
      return {
        sells: (base.sells && base.sells.length ? base.sells : [{ shares: null, price: null }]).map((x) => ({ shares: x.shares, price: x.price, orderNo: x.orderNo || null, fillKey: x.fillKey || x.orderNo || null, time: x.time || null })),
        fee: base.fee,
        offer: base.offer,
        deposit: base.deposit != null ? base.deposit : null,
        source: local ? "local" : fromJson ? "json" : "none",
      };
    }
    function offerOf(item, rec) {
      if (rec && rec.offer != null) return rec.offer;
      if (item.result && item.result.offerPrice != null) return item.result.offerPrice;
      return null;
    }
    function myCalc(item) {
      const rec = myRecord(item);
      const offer = offerOf(item, rec);
      const sells = rec.sells.filter((x) => x.shares > 0 && x.price > 0);
      const fee = rec.fee != null ? rec.fee : defaultSubFee(item);
      if (!sells.length || offer == null) return { ok: false, rec, offer, fee };
      let shares = 0, proceeds = 0, tax = 0, sellFee = 0;
      for (const x of sells) {
        const amt = x.shares * x.price;
        shares += x.shares; proceeds += amt;
        tax += Math.floor(amt * SELL_TAX_RATE);
        sellFee += Math.floor(amt * (Number(costCfg.feePct) || 0) / 100);
      }
      const gross = proceeds - shares * offer;
      const costs = costCfg.on ? tax + sellFee : 0;
      const profit = gross - (fee || 0) - costs;
      return { ok: true, rec, offer, fee, shares, proceeds, avg: proceeds / shares, gross, tax, sellFee, costs, profit };
    }
    function renderMyTotal() {
      const el = document.getElementById("myTotal");
      let sum = 0, n = 0;
      for (const it of items) {
        if (!isMine(it)) continue;
        const c = myCalc(it);
        if (c.ok) { sum += c.profit; n += 1; }
      }
      if (!n) { el.hidden = true; return; }
      el.hidden = false;
      el.innerHTML = `내 손익 <b class="${sum > 0 ? "gain" : sum < 0 ? "loss" : ""}">${escapeHtml(fmtWon(sum))}</b> <span class="n">${n}종목</span>`;

    // ---- 청약 추천 (단순 규칙 · 투자 권유 아님) ----
    const MY_BROKERS = ["한투", "대신", "신한", "KB", "NH", "미래", "유진", "키움", "삼성"];
    function brokerList(item) {
      const raw = Array.isArray(item.brokers) ? item.brokers : String(item.brokers || "").split(/[,·\/]/);
      return [...new Set(raw.map(abbreviateBroker).filter(Boolean))];
    }
    function hasAccount(item) {
      const b = brokerList(item);
      return !b.length || b.some((x) => MY_BROKERS.includes(x));
    }
    const SCORE_PT = { "A+": 2, A: 2, "A-": 2, "B+": 1, B: 1, "B-": 1, "C+": 0, C: 0, "C-": 0, "D+": -1, D: -1, "E+": -1, E: -1 };
    function recInfo(item) {
      const d = item.demand || {};
      const rows = [];
      const add = (k, val, pt) => rows.push({ k, val, pt });
      const comp = d.instCompetition;
      if (comp == null) add("기관 경쟁률", "확인중", 0);
      else add("기관 경쟁률", `${comp.toLocaleString("ko-KR")}:1`, comp >= 1000 ? 2 : comp >= 500 ? 1 : comp >= 200 ? 0 : comp >= 100 ? -1 : -2);
      const lk = d.lockupPct;
      if (lk == null) add("의무보유 확약", "확인중", 0);
      else add("의무보유 확약", `${lk}%`, lk >= 15 ? 2 : lk >= 5 ? 1 : lk < 1 ? -1 : 0);
      const fl = d.floatPct;
      if (fl == null) add("유통가능 물량", "확인중", 0);
      else add("유통가능 물량", `${fl}%`, fl <= 25 ? 1 : fl > 35 ? -1 : 0);
      const o = d.offerPrice, lo = d.bandLow, hi = d.bandHigh;
      if (o == null || hi == null) add("확정 공모가", "확인중", 0);
      else {
        const W = (n) => n.toLocaleString("ko-KR");
        const band = lo === hi ? `${W(hi)}원 고정` : `밴드 ${W(lo)}~${W(hi)}`;
        const pos = o > hi ? "상단 초과" : o === hi ? "상단" : o < lo ? "밴드 하단 미만" : o === lo ? "하단" : "밴드 내";
        add("확정 공모가", `${W(o)}원 · ${pos} (${band})`, o >= hi ? 1 : o < lo ? -2 : o === lo ? -1 : 0);
      }
      const sc = item.score == null || item.score === "" ? null : String(item.score).trim();
      add("종합점수", sc || "없음", sc && SCORE_PT[sc] != null ? SCORE_PT[sc] : 0);
      const total = rows.reduce((s, r) => s + r.pt, 0);
      let label, cls;
      if (comp == null) { label = "확인중"; cls = "tbd"; }
      else if (total >= 5) { label = "청약 추천"; cls = "buy"; }
      else if (total >= 2) { label = "소액"; cls = "small"; }
      else { label = "보류"; cls = "hold"; }
      const short = { buy: "추천", small: "소액", hold: "보류", tbd: "확인중" }[cls];
      return { rows, total, label, short, cls, account: hasAccount(item), brokers: brokerList(item) };
    }
    const REC_RULE_HTML =
      `<b>점수 합계 → 5점 이상 '청약 추천' · 2~4점 '소액' · 1점 이하 '보류'</b><br>` +
      `기관 경쟁률 1000:1↑ +2 · 500↑ +1 · 200~500 0 · 100~200 −1 · 100 미만 −2<br>` +
      `의무보유 확약 15%↑ +2 · 5%↑ +1 · 1% 미만 −1<br>` +
      `유통가능 물량 25% 이하 +1 · 35% 초과 −1<br>` +
      `확정 공모가 상단 이상 +1 · 하단 −1 · 밴드 미만 −2<br>` +
      `종합점수 A +2 · B/B+ +1 · C +0 · D/E −1<br>` +
      `데이터: 38커뮤니케이션 종목 상세(증권신고서 기준). 값이 없으면 '확인중'(0점).`;
    function recBadgeHtml(item, compact) {
      const r = recInfo(item);
      return `<span class="rec-badge ${r.cls}">${escapeHtml(compact ? r.short : r.label)}</span>` +
        (r.account ? "" : `<span class="noacct">계좌 없음</span>`);
    }

    // ---- 증거금 · 환불 · 묶인 돈 ----
    function parseWon(s) {
      if (s == null) return null;
      if (typeof s === "number") return s;
      const t = String(s).replace(/[,\s]/g, "");
      let m = t.match(/^([\d.]+)만원?$/);
      if (m) return Math.round(parseFloat(m[1]) * 10000);
      m = t.match(/^(\d+)원?$/);
      return m ? parseInt(m[1], 10) : null;
    }
    function fmtMan(n) {
      if (n == null) return "확인중";
      const m = n / 10000;
      return (Math.round(m * 100) / 100).toLocaleString("ko-KR") + "만원";
    }
    function depositOf(item) {
      const loc = myMap[itemKey(item)];
      if (loc && loc.deposit != null) return loc.deposit;
      return parseWon(item.minDeposit);
    }
    function addDays(key, n) { const d = parseYMD(key); d.setDate(d.getDate() + n); return toDateKey(d); }
    // 마감일에 청약한다고 가정: 마감일 ~ 환불 전날까지 묶임, 환불일에 돌아옴
    function moneyByDate() {
      const tied = {}, refund = {};
      for (const it of items) {
        if (!isMine(it) || !it.subscribeEnd || !it.refundDate) continue;
        const dep = depositOf(it);
        if (dep == null) continue;
        let k = it.subscribeEnd;
        while (k < it.refundDate) {
          (tied[k] = tied[k] || { sum: 0, items: [] }).sum += dep; tied[k].items.push(it);
          k = addDays(k, 1);
        }
        (refund[it.refundDate] = refund[it.refundDate] || { sum: 0, items: [] }).sum += dep;
        refund[it.refundDate].items.push(it);
      }
      return { tied, refund };
    }
    function reuseHint(item) {
      if (!item.refundDate) return "환불일 확인중";
      const later = items.filter((o) => o !== item && o.subscribeEnd && o.subscribeEnd >= item.refundDate && o.subscribeStart <= addDays(item.refundDate, 14))
        .sort((a, b) => a.subscribeEnd.localeCompare(b.subscribeEnd));
      const blocked = items.filter((o) => o !== item && o.subscribeEnd && o.subscribeEnd > item.subscribeEnd && o.subscribeEnd < item.refundDate);
      const parts = [];
      if (blocked.length) parts.push(`환불 전 마감이라 같은 돈 못 씀: ${blocked.map((o) => `${o.name}(${formatYMDKo(o.subscribeEnd)} 마감)`).join(", ")}`);
      if (later.length) parts.push(`환불금 재사용 가능: ${later.slice(0, 3).map((o) => `${o.name}(${formatYMDKo(o.subscribeStart)}~${formatYMDKo(o.subscribeEnd)})`).join(", ")}`);
      if (!parts.length) parts.push("환불일 이후 2주 내 예정된 청약 없음");
      return parts.join("<br>");
    }

    // ---- 체결 문자 파서 (계좌번호·계좌명은 읽지도 저장하지도 않음) ----
    const BROKER_TAGS = /(한국투자|한투|키움|미래에셋|NH|나무|KB|신한|대신|크레온|삼성|유진|하나|IBK|토스)/;
    function splitMessages(text) {
      const t = String(text || "").replace(/\r/g, "");
      let chunks = t.split(/\n\s*\n+/);
      const out = [];
      for (const c of chunks) {
        const parts = c.split(/(?=\[[^\]\n]{0,30}(?:체결|증권|투자|Web발신|웹발신)[^\]\n]{0,30}\])/);
        for (const p of parts) {
          const s = p.trim();
          if (!s) continue;
          // '[Web발신]' 다음 줄에 '[한국투자증권 체결안내]'가 오면 합침
          if (out.length && /^\[(?:Web|웹)발신\]\s*$/.test(out[out.length - 1])) out[out.length - 1] += "\n" + s;
          else out.push(s);
        }
      }
      return out;
    }
    function pickNum(s, res) {
      for (const re of res) { const m = s.match(re); if (m) return parseInt(m[1].replace(/,/g, ""), 10); }
      return null;
    }
    function parseFill(raw) {
      // 계좌 관련 부분은 먼저 지워 버림
      const s = String(raw)
        .replace(/(계좌번호|계좌|계좌명|고객명|성명)\s*[:：]?\s*[^\s*\/|,]+/g, " ")
        .replace(/\d{2,}\*+\d*(-\d+)?/g, " ");
      const isSell = /매도/.test(s) && !/매수체결|매수\s*체결|현금매수|신용매수/.test(s);
      const isBuy = /매수/.test(s) && !isSell;
      let code = null;
      let m = s.match(/\(A?([0-9][0-9A-Z]{5})\)/) || s.match(/종목코드\s*[:：]?\s*A?([0-9][0-9A-Z]{5})/) || s.match(/\bA([0-9]{6})\b/);
      if (m) code = m[1];
      let name = null;
      m = s.match(/종목명?\s*[:：]\s*([^\s*\/|,(]+)/) || s.match(/종목\s+([^\s*\/|,(]+)/);
      if (m) name = m[1].trim();
      if (!name) { m = s.match(/([가-힣A-Za-z0-9&]+)\s*\(A?[0-9][0-9A-Z]{5}\)/); if (m) name = m[1]; }
      const qty = pickNum(s, [/(?<!총)체결수량\s*[:：]?\s*([\d,]+)/, /체결\s*[:：]?\s*([\d,]+)\s*주/, /수량\s*[:：]?\s*([\d,]+)/, /([\d,]+)\s*주(?!문)/]);
      const price = pickNum(s, [/체결단가\s*[:：]?\s*([\d,]+)/, /체결가(?:격)?\s*[:：]?\s*([\d,]+)/, /단가\s*[:：]?\s*([\d,]+)/, /가격\s*[:：]?\s*([\d,]+)/, /([\d,]{4,})\s*원/]);
      const orderQty = pickNum(s, [/주문수량\s*[:：]?\s*([\d,]+)/]);
      const totalQty = pickNum(s, [/총체결수량\s*[:：]?\s*([\d,]+)/]);
      m = s.match(/(?:원?주문번호|주문No\.?|주문)\s*[:：]?\s*(\d{3,})/);
      const orderNo = m ? m[1] : null;
      m = s.match(/(?:^|[^\d])(\d{1,2}:\d{2})(?::\d{2})?/);
      const time = m ? m[1] : null;
      const partial = orderQty != null && totalQty != null && totalQty < orderQty;
      const fillKey = orderNo ? (partial ? `${orderNo}:${totalQty}` : orderNo) : `t${time || ""}|${qty}|${price}`;
      return { isSell, isBuy, code, name, qty, price, orderNo, time, fillKey, partial };
    }
    function normName(s) { return String(s || "").replace(/\s|\(주\)|㈜|주식회사/g, "").toLowerCase(); }
    function matchItem(f, raw) {
      if (f.code) { const it = items.find((x) => x.code && x.code === f.code); if (it) return it; }
      const n = normName(f.name);
      if (n) {
        const it = items.find((x) => normName(x.name) === n) || items.find((x) => n.includes(normName(x.name)) || normName(x.name).includes(n));
        if (it) return it;
      }
      const t = normName(raw);
      return items.find((x) => normName(x.name).length >= 2 && t.includes(normName(x.name))) || null;
    }
    function existingFillKeys(item) {
      const rec = myRecord(item);
      const keys = new Set();
      for (const x of rec.sells) if (x.orderNo) keys.add(String(x.fillKey || x.orderNo));
      const j = jsonMy(item);
      if (j) for (const x of j.sells) if (x.orderNo) keys.add(String(x.fillKey || x.orderNo));
      return keys;
    }
    function parseFillMessages(text) {
      const seen = new Set();
      return splitMessages(text).map((raw) => {
        const f = parseFill(raw);
        const item = matchItem(f, raw);
        let status = "ok", why = "";
        if (!f.isSell) { status = "skip"; why = f.isBuy ? "매수 체결 (제외)" : "매도 체결 문자가 아님"; }
        else if (!f.qty || !f.price) { status = "skip"; why = "수량·단가를 못 읽음"; }
        else if (!item) { status = "nomatch"; why = "공모주 목록에서 종목을 못 찾음"; }
        else if (existingFillKeys(item).has(f.fillKey) || seen.has(item.id + "#" + f.fillKey)) { status = "dup"; why = "이미 추가된 주문번호"; }
        if (item && status !== "skip") seen.add(item.id + "#" + f.fillKey);
        return { ...f, itemId: item ? itemKey(item) : null, status, why };
      });
    }
    function applyFills(fills) {
      let n = 0;
      for (const f of fills) {
        if (f.status !== "ok" || !f.itemId) continue;
        const item = items.find((x) => itemKey(x) === f.itemId);
        if (!item) continue;
        const k = itemKey(item);
        const base = myRecord(item);
        const rec = myMap[k] || { sells: base.sells, fee: base.fee, offer: base.offer, deposit: base.deposit };
        rec.sells = (rec.sells || []).filter((x) => x.shares > 0 || x.price > 0);
        rec.sells.push({ shares: f.qty, price: f.price, orderNo: f.orderNo || null, fillKey: f.fillKey, time: f.time || null });
        myMap[k] = rec;
        if (!isMine(item)) setMine(k, true);
        n++;
      }
      saveMy();
      return n;
    }

    // ---- 월별 수익 요약 ----
    function monthOf(key) { return key ? key.slice(0, 7) : ""; }
    function summaryData(y, m) {
      const ym = `${y}-${pad2(m + 1)}`;
      const yy = String(y);
      let mAct = 0, yAct = 0, mN = 0, yN = 0, mExpAll = 0, mExpMine = 0, mExpN = 0, mExpMineN = 0, feeUnknown = 0;
      const ranking = [], openRank = [];
      const byMonth = {};
      for (const it of items) {
        const mk = monthOf(it.listDate);
        if (!mk) continue;
        const c = isMine(it) ? myCalc(it) : null;
        const bm = (byMonth[mk] = byMonth[mk] || { act: 0, actN: 0, exp: 0, expMine: 0 });
        if (c && c.ok) {
          bm.act += c.profit; bm.actN++;
          if (mk.startsWith(yy)) { yAct += c.profit; yN++; }
          if (mk === ym) { mAct += c.profit; mN++; }
          if (mk.startsWith(yy)) ranking.push({ it, profit: c.profit, pct: (c.profit / (c.shares * c.offer)) * 100, shares: c.shares });
        }
        const r = it.result;
        if (r && r.profitWon != null) {
          bm.exp += r.profitWon; if (isMine(it)) bm.expMine += r.profitWon;
          if (mk === ym) {
            mExpAll += r.profitWon; mExpN++;
            if (isMine(it)) { mExpMine += r.profitWon; mExpMineN++; }
            if (!r.profitIncludesFee) feeUnknown++;
          }
        }
        if (mk === ym && r && r.openReturnPct != null) openRank.push({ it, pct: r.openReturnPct, exp: r.profitWon });
      }
      ranking.sort((a, b) => b.pct - a.pct);
      openRank.sort((a, b) => b.pct - a.pct);
      return { ym, mAct, yAct, mN, yN, mExpAll, mExpMine, mExpN, mExpMineN, feeUnknown, ranking, openRank, byMonth };
    }
    let sumY = null, sumM = null;
    function gl(n) { return n > 0 ? "gain-t" : n < 0 ? "loss-t" : ""; }
    function renderSummary(el) {
      if (sumY == null) { sumY = viewYear; sumM = viewMonth; }
      const s = summaryData(sumY, sumM);
      let h = `<div class="sheet-head"><h3 id="sheetTitle">📊 수익 요약</h3><button type="button" class="sheet-close" aria-label="닫기">×</button></div>` +
        `<div class="month-nav"><button type="button" data-sum-nav="-1" aria-label="이전 달">‹</button><b>${sumY}년 ${sumM + 1}월</b><button type="button" data-sum-nav="1" aria-label="다음 달">›</button></div>` +
        `<div class="sum-cards">` +
        `<div class="sum-card"><div class="lab">이번 달 실제 손익</div><div class="val ${gl(s.mAct)}">${s.mN ? escapeHtml(fmtWon(s.mAct)) : "—"}</div><div class="kv">${s.mN}종목 · 내 매도 입력 기준</div></div>` +
        `<div class="sum-card"><div class="lab">${sumY}년 누적 실제 손익</div><div class="val ${gl(s.yAct)}">${s.yN ? escapeHtml(fmtWon(s.yAct)) : "—"}</div><div class="kv">${s.yN}종목</div></div>` +
        `<div class="sum-card exp"><div class="lab">예상 · ✓종목 최소청약</div><div class="val ${gl(s.mExpMine)}">${s.mExpMineN ? escapeHtml(fmtWon(s.mExpMine)) : "—"}</div><div class="kv">${s.mExpMineN}종목</div></div>` +
        `<div class="sum-card exp"><div class="lab">예상 · 전 종목 최소청약</div><div class="val ${gl(s.mExpAll)}">${s.mExpN ? escapeHtml(fmtWon(s.mExpAll)) : "—"}</div><div class="kv">${s.mExpN}종목</div></div>` +
        `</div><div class="note-s">'예상'은 실제 손익이 아니라 최소청약 균등배정 기대 주수 × (시초가 − 공모가) − 청약수수료 가정치예요. 월 구분은 상장일 기준.${s.feeUnknown ? ` 수수료 확인중 ${s.feeUnknown}종목 포함.` : ""}</div>`;
      h += `<div class="sheet-sec"><h4>내 종목 수익률 순위 (${sumY}년)</h4>`;
      h += s.ranking.length
        ? `<table class="sum-tbl"><tr><th>#</th><th>종목</th><th class="r">수익률</th><th class="r">손익</th></tr>` +
          s.ranking.map((x, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(x.it.name)} <span class="kv">${x.shares}주</span></td><td class="r ${gl(x.pct)}">${escapeHtml(fmtPct(x.pct))}</td><td class="r ${gl(x.profit)}">${escapeHtml(fmtWon(x.profit))}</td></tr>`).join("") + `</table>`
        : `<div class="kv">아직 입력한 매도 기록이 없어요. 카드 탭 → 내 매도 입력, 또는 📋 체결 문자 붙여넣기.</div>`;
      h += `</div><div class="sheet-sec"><h4>${sumM + 1}월 상장 · 시초가 수익률 순위 (예상)</h4>`;
      h += s.openRank.length
        ? `<table class="sum-tbl"><tr><th>#</th><th>종목</th><th class="r">시초</th><th class="r">최소청약 예상</th></tr>` +
          s.openRank.map((x, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(x.it.name)}${isMine(x.it) ? " ✓" : ""}</td><td class="r ${gl(x.pct)}">${escapeHtml(fmtPct(x.pct))}</td><td class="r">${x.exp != null ? escapeHtml(fmtWon(x.exp)) : "확인중"}</td></tr>`).join("") + `</table>`
        : `<div class="kv">이 달 상장 결과 없음 (확인중)</div>`;
      const months = Object.keys(s.byMonth).filter((k) => k.startsWith(String(sumY))).sort();
      h += `</div><div class="sheet-sec"><h4>${sumY}년 월별</h4><table class="sum-tbl"><tr><th>월</th><th class="r">실제</th><th class="r">예상(✓)</th><th class="r">예상(전체)</th></tr>` +
        months.map((k) => { const b = s.byMonth[k]; return `<tr><td>${Number(k.slice(5))}월</td><td class="r ${gl(b.act)}">${b.actN ? escapeHtml(fmtWon(b.act)) : "—"}</td><td class="r">${escapeHtml(fmtWon(b.expMine))}</td><td class="r">${escapeHtml(fmtWon(b.exp))}</td></tr>`; }).join("") +
        `</table></div>`;
      el.innerHTML = h;
    }

    // ---- 체결 문자 붙여넣기 화면 ----
    let pasteFills = [];
    function renderPaste(el) {
      let h = `<div class="sheet-head"><h3 id="sheetTitle">📋 체결 문자 붙여넣기</h3><button type="button" class="sheet-close" aria-label="닫기">×</button></div>` +
        `<div class="kv">증권사 매도 체결 문자를 그대로 붙여넣으세요. 여러 개도 한 번에 돼요 (한투·키움·미래·NH·KB·신한·대신·삼성 등).</div>` +
        `<textarea id="pasteBox" placeholder="[한국투자증권 체결안내]09:05 *종목명:영광(359410) *매매구분:현금매도체결 *체결수량:2주 *체결단가:27,450원 *주문번호:3716100"></textarea>` +
        `<div class="btn-row"><button type="button" class="btn-sub" data-paste="parse">미리보기</button><button type="button" class="btn-primary" data-paste="apply" ${pasteFills.some((f) => f.status === "ok") ? "" : "disabled"}>내 매도에 추가</button></div>` +
        `<div class="note-s">🔒 계좌번호·계좌명은 읽지 않고 저장하지 않아요. 종목·수량·단가·주문번호·시각만 이 기기(브라우저)에 저장되고, 붙여넣은 원문은 추가 후 지워져요. 같은 주문번호는 두 번 추가되지 않아요.</div>`;
      if (pasteFills.length) {
        const opts = (sel) => `<option value="">종목 선택…</option>` + items.slice().sort((a, b) => (b.listDate || "").localeCompare(a.listDate || "")).map((it) => `<option value="${escapeHtml(itemKey(it))}" ${sel === itemKey(it) ? "selected" : ""}>${escapeHtml(it.name)}</option>`).join("");
        h += `<ul class="pv-list">` + pasteFills.map((f, i) => {
          const it = f.itemId && items.find((x) => itemKey(x) === f.itemId);
          const st = { ok: "추가", dup: "중복", skip: "제외", nomatch: "매칭 실패" }[f.status];
          const W = (n) => n == null ? "?" : n.toLocaleString("ko-KR");
          return `<li class="pv-item ${f.status === "ok" ? "ok" : "skip"}"><span class="st">${st}</span><div>` +
            `<b>${escapeHtml(it ? it.name : f.name || "종목?")}</b>${f.code ? ` <span class="kv">${escapeHtml(f.code)}</span>` : ""} · ${f.isSell ? "매도" : f.isBuy ? "매수" : "?"} ${W(f.qty)}주 × ${W(f.price)}원` +
            `<div class="kv">${f.time ? escapeHtml(f.time) + " · " : ""}주문번호 ${escapeHtml(f.orderNo || "없음")}${f.partial ? " (부분체결)" : ""}${f.why ? " · " + escapeHtml(f.why) : ""}</div>` +
            (f.status === "nomatch" && f.isSell ? `<select data-pv-pick="${i}">${opts("")}</select>` : "") +
            `</div></li>`;
        }).join("") + `</ul>`;
      }
      el.innerHTML = h;
    }

    // ---- 내 캘린더에 추가 ----
    const ICS_PATH = "vincent533.github.io/ipo-calendar/calendar.ics";
    function renderCal(el) {
      const webcal = `webcal://${ICS_PATH}`;
      const google = `https://calendar.google.com/calendar/r?cid=${webcal}`;
      el.innerHTML = `<div class="sheet-head"><h3 id="sheetTitle">📅 내 캘린더에 추가</h3><button type="button" class="sheet-close" aria-label="닫기">×</button></div>` +
        `<div class="kv">청약(시작~마감, 마감일 오전 9시 알림)과 상장일(오전 8:30 알림)이 휴대폰 캘린더에 자동으로 들어와요. 데이터가 바뀌면 캘린더도 따라 갱신돼요.</div>` +
        `<div class="btn-row"><a class="btn-primary" href="${escapeHtml(webcal)}">아이폰 · 맥 (webcal)</a><a class="btn-sub" href="${escapeHtml(google)}" target="_blank" rel="noopener">Google 캘린더</a></div>` +
        `<div class="note-s">📱 아이폰: 왼쪽 버튼 → '구독' 누르면 끝. 🤖 안드로이드: 오른쪽 버튼으로 Google 캘린더에 추가(PC 브라우저에서 한 번 누르면 휴대폰에도 동기화, 알림은 Google 기본 알림 사용).</div>` +

    }

    // ---- 상세 패널 ----
    let sheetKey = null;
    let sheetType = null;
    let sheetMode = null; // item | summary | paste | cal
    let pasteText = "";
    let pasteMsg = "";
    function showSheet() {
      document.getElementById("sheetBackdrop").hidden = false;
      document.body.style.overflow = "hidden";

    function openTool(mode) {

    function openSheet(k, type) {
